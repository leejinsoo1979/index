<svg xmlns="http://www.w3.org/2000/svg" width="840" height="560" viewBox="0 0 840 560" role="img" aria-labelledby="title desc"><title id="title">우물천장 개념도</title><desc id="desc">가장자리보다 높은 중앙 천장면과 간접광이 공간감을 만드는 관계다. 기존 구조체를 높이는 방식이나 부재 상세를 뜻하지 않는다.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><style>text{font-family:'Apple SD Gothic Neo','Noto Sans KR',sans-serif;font-size:19px;fill:#243b4a}.heading{font-size:26px;font-weight:700}.foot{font-size:17px;fill:#526974}</style><rect width="840" height="560" fill="#fbfbf7"/><text x="40" y="55" class="heading">우물천장</text><rect x="80" y="150" width="660" height="270" fill="#fae8d2" /><rect x="80" y="150" width="660" height="35" fill="#c2c8cc" /><rect x="80" y="185" width="130" height="75" fill="#c2c8cc" /><rect x="610" y="185" width="130" height="75" fill="#c2c8cc" /><text x="300" y="220" class="">중앙의 높은 면</text><text x="88" y="300" class="">낮은 가장자리</text><text x="592" y="300" class="">낮은 가장자리</text><path d="M205 255 L310 190" stroke="#d8b046" stroke-width="4" fill="none" marker-end="url(#arr)"/><path d="M615 255 L510 190" stroke="#d8b046" stroke-width="4" fill="none" marker-end="url(#arr)"/><path d="M420 390 L420 245" stroke="#4382a8" stroke-width="4" fill="none" marker-end="url(#arr)"/><text x="310" y="465" class="">높이 대비와 반사광의 관계</text><text x="40" y="530" class="foot">개념도 · 축척 없음</text></svg>