<svg xmlns="http://www.w3.org/2000/svg" width="840" height="560" viewBox="0 0 840 560" role="img" aria-labelledby="title desc"><title id="title">창호 접합부 단열 개념도</title><desc id="desc">창 자체의 성능과 별개로 벽·바닥의 단열이 창 주변까지 연결되는 관계를 보여 준다. 창 고정이나 방수의 시공 상세가 아니다.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><style>text{font-family:'Apple SD Gothic Neo','Noto Sans KR',sans-serif;font-size:19px;fill:#243b4a}.heading{font-size:26px;font-weight:700}.foot{font-size:17px;fill:#526974}</style><rect width="840" height="560" fill="#fbfbf7"/><text x="40" y="55" class="heading">창호 접합부 단열</text><rect x="100" y="150" width="205" height="260" fill="#fae8d2" /><rect x="305" y="150" width="70" height="260" fill="#dcebf3" /><rect x="375" y="150" width="340" height="260" fill="#dcebf3" /><rect x="100" y="370" width="205" height="40" fill="#c2c8cc" /><rect x="100" y="350" width="220" height="20" fill="#63aaa1" /><rect x="305" y="150" width="25" height="200" fill="#63aaa1" /><rect x="330" y="155" width="30" height="155" fill="#243b4a" /><text x="110" y="210" class="">실내</text><text x="460" y="210" class="">외기</text><text x="410" y="300" class="">창호</text><path d="M500 310 L350 310" stroke="#4382a8" stroke-width="4" fill="none" marker-end="url(#arr)"/><path d="M185 300 L300 347" stroke="#d0663e" stroke-width="4" fill="none" marker-end="url(#arr)"/><text x="110" y="450" class="">바닥 단열 ↔ 창 주변 연결</text><text x="430" y="450" class="">지지 · 기밀 · 방수는 별도 검토</text><text x="40" y="530" class="foot">개념도 · 축척 없음</text></svg>