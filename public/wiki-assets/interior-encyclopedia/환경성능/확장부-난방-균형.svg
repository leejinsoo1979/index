<svg xmlns="http://www.w3.org/2000/svg" width="840" height="560" viewBox="0 0 840 560" role="img" aria-labelledby="title desc"><title id="title">확장부 난방 개념도</title><desc id="desc">확장부의 바닥에서 실내로 전달되는 열과 외곽으로 빠져나가는 열을 함께 고려한다. 배관 배열이나 간격을 나타내지 않는다.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><style>text{font-family:'Apple SD Gothic Neo','Noto Sans KR',sans-serif;font-size:19px;fill:#243b4a}.heading{font-size:26px;font-weight:700}.foot{font-size:17px;fill:#526974}</style><rect width="840" height="560" fill="#fbfbf7"/><text x="40" y="55" class="heading">확장부 난방</text><rect x="100" y="150" width="620" height="250" fill="#fae8d2" /><rect x="100" y="400" width="620" height="35" fill="#c2c8cc" /><rect x="100" y="375" width="620" height="25" fill="#63aaa1" /><path d="M450 155 L450 370" stroke="#243b4a" stroke-width="4" fill="none" stroke-dasharray="8 8"/><text x="185" y="200" class="">기존 난방 공간</text><text x="505" y="200" class="">확장부</text><path d="M130 350H680" stroke="#db9164" stroke-width="15"/><path d="M240 330 L240 250" stroke="#d0663e" stroke-width="4" fill="none" marker-end="url(#arr)"/><path d="M570 330 L570 250" stroke="#d0663e" stroke-width="4" fill="none" marker-end="url(#arr)"/><path d="M645 285 L760 285" stroke="#d0663e" stroke-width="4" fill="none" marker-end="url(#arr)"/><text x="485" y="465" class="">외곽 열손실도 함께 관리</text><text x="100" y="465" class="">실내로 전달되는 열</text><text x="40" y="530" class="foot">개념도 · 축척 없음</text></svg>