<svg xmlns="http://www.w3.org/2000/svg" width="840" height="560" viewBox="0 0 840 560" role="img" aria-labelledby="title desc"><title id="title">에어컨 점검공간 개념도</title><desc id="desc">공기 이동 경로와 점검을 위해 접근하는 경로는 서로 다르다. 점선 영역은 여유 검토의 개념이며 실제 서비스 치수가 아니다.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><style>text{font-family:'Apple SD Gothic Neo','Noto Sans KR',sans-serif;font-size:19px;fill:#243b4a}.heading{font-size:26px;font-weight:700}.foot{font-size:17px;fill:#526974}</style><rect width="840" height="560" fill="#fbfbf7"/><text x="40" y="55" class="heading">에어컨 점검공간</text><rect x="170" y="150" width="470" height="100" fill="#c2c8cc" /><rect x="255" y="175" width="280" height="65" fill="#dcebf3" /><text x="305" y="217" class="">실내기</text><rect x="210" y="250" width="380" height="145" fill="#f9f2e8" stroke="#4382a8" stroke-width="3" stroke-dasharray="8 7"/><path d="M285 285 L285 235" stroke="#4382a8" stroke-width="4" fill="none" marker-end="url(#arr)"/><path d="M480 240 L480 300" stroke="#d0663e" stroke-width="4" fill="none" marker-end="url(#arr)"/><path d="M405 470 L405 330" stroke="#243b4a" stroke-width="4" fill="none" marker-end="url(#arr)"/><text x="225" y="425" class="">열기 · 청소 · 분해 접근 경로</text><text x="575" y="310" class="">공기 경로</text><text x="95" y="120" class="">천장 또는 가구의 가림 부분</text><text x="40" y="530" class="foot">개념도 · 축척 없음</text></svg>