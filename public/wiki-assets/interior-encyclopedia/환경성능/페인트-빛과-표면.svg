<svg xmlns="http://www.w3.org/2000/svg" width="840" height="560" viewBox="0 0 840 560" role="img" aria-labelledby="title desc"><title id="title">실내 페인트 선택 개념도</title><desc id="desc">같은 계열의 색도 빛의 방향과 표면 광택, 인접 재료에 따라 다르게 보인다. 색칩은 제품 색상표나 성능 등급이 아니다.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><style>text{font-family:'Apple SD Gothic Neo','Noto Sans KR',sans-serif;font-size:19px;fill:#243b4a}.heading{font-size:26px;font-weight:700}.foot{font-size:17px;fill:#526974}</style><rect width="840" height="560" fill="#fbfbf7"/><text x="40" y="55" class="heading">실내 페인트 선택</text><rect x="95" y="165" width="220" height="245" fill="#ede7dc" /><rect x="380" y="165" width="220" height="245" fill="#ede7dc" /><rect x="625" y="165" width="90" height="245" fill="#d8c2a5" /><text x="115" y="450" class="">낮은 광택의 인상</text><text x="385" y="450" class="">반사가 드러난 인상</text><path d="M490 90 L490 190" stroke="#d8b046" stroke-width="4" fill="none" marker-end="url(#arr)"/><path d="M490 240 L580 150" stroke="#d8b046" stroke-width="4" fill="none" marker-end="url(#arr)"/><path d="M195 100 L195 190" stroke="#d8b046" stroke-width="4" fill="none" marker-end="url(#arr)"/><path d="M650 300 L560 300" stroke="#4382a8" stroke-width="4" fill="none" marker-end="url(#arr)"/><text x="325" y="115" class="">빛</text><text x="630" y="140" class="">인접 재료</text><text x="40" y="530" class="foot">개념도 · 축척 없음</text></svg>