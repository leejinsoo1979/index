<svg xmlns="http://www.w3.org/2000/svg" width="840" height="560" viewBox="0 0 840 560" role="img" aria-labelledby="title desc"><title id="title">결로 개념도</title><desc id="desc">실내 수증기가 차가운 표면 또는 마감 뒤의 차가운 부위에 도달할 수 있는 관계를 구분한 그림이다. 물방울 표시는 발생 가능 위치이지 확정 진단이 아니다.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><style>text{font-family:'Apple SD Gothic Neo','Noto Sans KR',sans-serif;font-size:19px;fill:#243b4a}.heading{font-size:26px;font-weight:700}.foot{font-size:17px;fill:#526974}</style><rect width="840" height="560" fill="#fbfbf7"/><text x="40" y="55" class="heading">결로</text><rect x="90" y="145" width="165" height="270" fill="#dcebf3" /><rect x="255" y="145" width="60" height="270" fill="#c2c8cc" /><rect x="315" y="145" width="70" height="270" fill="#63aaa1" /><rect x="385" y="145" width="330" height="270" fill="#fae8d2" /><text x="112" y="190" class="">차가운 쪽</text><text x="450" y="190" class="">실내 수증기</text><path d="M590 255 L405 255" stroke="#4382a8" stroke-width="4" fill="none" marker-end="url(#arr)"/><path d="M585 330 L300 330" stroke="#4382a8" stroke-width="4" fill="none" marker-end="url(#arr)"/><g fill="#4382a8"><ellipse cx="392" cy="268" rx="9" ry="13"/><ellipse cx="309" cy="345" rx="8" ry="12"/></g><text x="430" y="292" class="">표면의 가능 위치</text><text x="420" y="375" class="">마감 뒤의 가능 위치</text><text x="95" y="460" class="">표면온도 + 수증기량 + 습기 이동 경로</text><text x="40" y="530" class="foot">개념도 · 축척 없음</text></svg>