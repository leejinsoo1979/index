<svg xmlns="http://www.w3.org/2000/svg" width="840" height="560" viewBox="0 0 840 560" role="img" aria-labelledby="title desc"><title id="title">에어컨과 천장 높이 개념도</title><desc id="desc">같은 방에서 천장 매입형 설비와 벽면 배치가 점유하는 위치를 비교한다. 어느 방식이든 높이·기류·점검 조건을 함께 확인해야 한다.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><style>text{font-family:'Apple SD Gothic Neo','Noto Sans KR',sans-serif;font-size:19px;fill:#243b4a}.heading{font-size:26px;font-weight:700}.foot{font-size:17px;fill:#526974}</style><rect width="840" height="560" fill="#fbfbf7"/><text x="40" y="55" class="heading">에어컨과 천장 높이</text><rect x="70" y="135" width="310" height="285" fill="#fae8d2" /><rect x="440" y="135" width="310" height="285" fill="#fae8d2" /><rect x="70" y="135" width="310" height="65" fill="#c2c8cc" /><rect x="160" y="150" width="120" height="40" fill="#dcebf3" /><rect x="440" y="135" width="310" height="20" fill="#c2c8cc" /><rect x="455" y="180" width="75" height="45" fill="#dcebf3" /><text x="95" y="260" class="">천장 매입 배치</text><text x="470" y="260" class="">벽면 배치</text><path d="M300 390 L300 220" stroke="#4382a8" stroke-width="4" fill="none" marker-end="url(#arr)"/><path d="M690 390 L690 170" stroke="#4382a8" stroke-width="4" fill="none" marker-end="url(#arr)"/><path d="M200 205 L200 300" stroke="#d0663e" stroke-width="4" fill="none" marker-end="url(#arr)"/><path d="M530 205 L610 290" stroke="#d0663e" stroke-width="4" fill="none" marker-end="url(#arr)"/><text x="75" y="465" class="">천장 공간 점유와 벽면 점유의 교환</text><text x="40" y="530" class="foot">개념도 · 축척 없음</text></svg>