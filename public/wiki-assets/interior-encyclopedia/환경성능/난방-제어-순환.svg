<svg xmlns="http://www.w3.org/2000/svg" width="840" height="560" viewBox="0 0 840 560" role="img" aria-labelledby="title desc"><title id="title">난방 제어와 사용량 개념도</title><desc id="desc">온도 감지와 난방수 순환, 바닥의 열 전달은 서로 다른 단계다. 계량과 청구는 해당 주택의 방식을 따로 확인해야 한다.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><style>text{font-family:'Apple SD Gothic Neo','Noto Sans KR',sans-serif;font-size:19px;fill:#243b4a}.heading{font-size:26px;font-weight:700}.foot{font-size:17px;fill:#526974}</style><rect width="840" height="560" fill="#fbfbf7"/><text x="40" y="55" class="heading">난방 제어와 사용량</text><rect x="70" y="160" width="185" height="90" fill="#dcebf3" rx="12"/><text x="90" y="215" class="">온도 감지·설정</text><rect x="335" y="160" width="170" height="90" fill="#fae8d2" rx="12"/><text x="360" y="215" class="">난방수 공급</text><rect x="580" y="160" width="165" height="90" fill="#fae8d2" rx="12"/><text x="610" y="215" class="">바닥·실내</text><path d="M260 205 L330 205" stroke="#d0663e" stroke-width="4" fill="none" marker-end="url(#arr)"/><path d="M510 205 L575 205" stroke="#d0663e" stroke-width="4" fill="none" marker-end="url(#arr)"/><path d="M660 270V365H160V265" fill="none" stroke="#4382a8" stroke-width="4" marker-end="url(#arr)"/><text x="270" y="345" class="">공간의 온도 변화가 제어에 반영</text><text x="110" y="445" class="">설정값 ≠ 사용량 ≠ 청구금액</text><text x="40" y="530" class="foot">개념도 · 축척 없음</text></svg>