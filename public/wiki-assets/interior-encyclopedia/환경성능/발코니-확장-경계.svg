<svg xmlns="http://www.w3.org/2000/svg" width="840" height="560" viewBox="0 0 840 560" role="img" aria-labelledby="title desc"><title id="title">발코니 확장 계획 개념도</title><desc id="desc">확장은 면적뿐 아니라 실내와 실외를 나누는 경계를 바꾸는 일이다. 점선은 이전 경계, 주황선은 확장 후 검토할 경계를 뜻한다.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><style>text{font-family:'Apple SD Gothic Neo','Noto Sans KR',sans-serif;font-size:19px;fill:#243b4a}.heading{font-size:26px;font-weight:700}.foot{font-size:17px;fill:#526974}</style><rect width="840" height="560" fill="#fbfbf7"/><text x="40" y="55" class="heading">발코니 확장 계획</text><rect x="90" y="145" width="410" height="265" fill="#fae8d2" /><rect x="500" y="145" width="220" height="265" fill="#dcebf3" /><text x="210" y="280" class="">기존 실내</text><text x="535" y="280" class="">기존 발코니</text><path d="M500 130 L500 425" stroke="#243b4a" stroke-width="4" fill="none" stroke-dasharray="10 8"/><path d="M95 140H730V415H95" fill="none" stroke="#d0663e" stroke-width="9"/><path d="M450 330 L625 330" stroke="#d0663e" stroke-width="4" fill="none" marker-end="url(#arr)"/><text x="395" y="375" class="">생활공간 편입</text><text x="100" y="470" class="">바깥 창 · 벽 · 바닥 · 천장의 경계 재검토</text><text x="40" y="530" class="foot">개념도 · 축척 없음</text></svg>