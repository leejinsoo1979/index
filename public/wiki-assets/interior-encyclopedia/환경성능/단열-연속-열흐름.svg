<svg xmlns="http://www.w3.org/2000/svg" width="840" height="560" viewBox="0 0 840 560" role="img" aria-labelledby="title desc"><title id="title">단열 연속성 개념도</title><desc id="desc">같은 벽이라도 단열층이 끊긴 곳에서는 열이 우회해 이동할 수 있다. 화살표의 굵기는 실제 열량을 표시하지 않는다.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><style>text{font-family:'Apple SD Gothic Neo','Noto Sans KR',sans-serif;font-size:19px;fill:#243b4a}.heading{font-size:26px;font-weight:700}.foot{font-size:17px;fill:#526974}</style><rect width="840" height="560" fill="#fbfbf7"/><text x="40" y="55" class="heading">단열 연속성</text><rect x="105" y="150" width="280" height="250" fill="#fae8d2" /><rect x="435" y="150" width="280" height="250" fill="#fae8d2" /><rect x="105" y="150" width="45" height="250" fill="#c2c8cc" /><rect x="435" y="150" width="45" height="250" fill="#c2c8cc" /><rect x="150" y="150" width="22" height="250" fill="#63aaa1" /><rect x="480" y="150" width="22" height="105" fill="#63aaa1" /><rect x="480" y="315" width="22" height="85" fill="#63aaa1" /><text x="180" y="210" class="">이어진 단열</text><text x="510" y="210" class="">끊긴 단열</text><path d="M280 285 L175 285" stroke="#d0663e" stroke-width="4" fill="none" marker-end="url(#arr)"/><path d="M620 285 L440 285" stroke="#d0663e" stroke-width="4" fill="none" marker-end="url(#arr)"/><text x="180" y="350" class="">열 이동 완화</text><text x="510" y="350" class="">취약 경로</text><text x="110" y="460" class="">가장자리와 이음부까지 이어지는지 확인</text><text x="40" y="530" class="foot">개념도 · 축척 없음</text></svg>