<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" role="img" aria-labelledby="title desc"><title id="title">라인조명</title><desc id="desc">길게 이어진 발광면의 확산빛과 천장 기준선의 어긋남을 비교하는 개념도</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#31536d"/></marker><linearGradient id="glow"><stop stop-color="#ffcf59" stop-opacity=".65"/><stop offset="1" stop-color="#ffcf59" stop-opacity=".06"/></linearGradient></defs><rect width="900" height="500" fill="#faf9f4"/><style>text{font-family:'Apple SD Gothic Neo','Noto Sans KR',sans-serif;font-size:19px;fill:#253d4a}.small{font-size:16px}.thin{stroke:#7c8c93;stroke-width:2;fill:none}.arrow{stroke:#31536d;stroke-width:2.5;fill:none;marker-end:url(#a)}.logic{stroke-dasharray:7 5}.surface{fill:#e5e9e7;stroke:#647b83;stroke-width:2}</style><rect x="90" y="95" width="705" height="16" rx="5" fill="#e5e9e7" stroke="#647b83" stroke-width="2"/><rect x="150" y="116" width="580" height="17" rx="5" fill="#f9cf66" stroke="#647b83" stroke-width="2"/><path d="M150 137L90 332H790L730 137Z" fill="#f9cf66" opacity=".3"/><path d="M230 153L180 297" class="arrow "/><path d="M442 153V297" class="arrow "/><path d="M650 153L710 297" class="arrow "/><text x="330" y="69" >길이 방향의 연속성</text><text x="358" y="245" >면으로 퍼지는 빛</text><path d="M105 374H790" stroke="#7c8c93" stroke-width="2" stroke-dasharray="6 6"/><path d="M105 389L265 384L420 399L600 386L790 393" stroke="#b06446" fill="none" stroke-width="5"/><text x="130" y="350" >천장 기준선</text><text x="490" y="431" >어긋남도 길게 드러남</text><text x="450" y="478" text-anchor="middle" class="small">원리 개념도 · 시공도면 아님</text></svg>