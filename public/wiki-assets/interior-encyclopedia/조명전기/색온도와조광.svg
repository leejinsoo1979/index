<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" role="img" aria-labelledby="title desc"><title id="title">색온도와 조광</title><desc id="desc">따뜻한 빛과 차가운 빛의 혼합 비율 축과 전체 밝기 축이 분리된 조절 원리</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#31536d"/></marker><linearGradient id="glow"><stop stop-color="#ffcf59" stop-opacity=".65"/><stop offset="1" stop-color="#ffcf59" stop-opacity=".06"/></linearGradient></defs><rect width="900" height="500" fill="#faf9f4"/><style>text{font-family:'Apple SD Gothic Neo','Noto Sans KR',sans-serif;font-size:19px;fill:#253d4a}.small{font-size:16px}.thin{stroke:#7c8c93;stroke-width:2;fill:none}.arrow{stroke:#31536d;stroke-width:2.5;fill:none;marker-end:url(#a)}.logic{stroke-dasharray:7 5}.surface{fill:#e5e9e7;stroke:#647b83;stroke-width:2}</style><defs><linearGradient id="cct"><stop stop-color="#efbe60"/><stop offset="1" stop-color="#a9cfe9"/></linearGradient></defs><rect x="175" y="90" width="600" height="50" fill="url(#cct)"/><text x="170" y="68" >따뜻한 계열</text><text x="665" y="68" >차가운 계열</text><path d="M175 172H770" class="arrow "/><text x="370" y="200" >혼합 비율 변화</text><path d="M180 240L180 405L775 405" class="thin"/><path d="M210 380H320V355H435V320H550V280H690V245" stroke="#31536d" stroke-width="4" fill="none"/><text x="85" y="310" >밝기</text><text x="290" y="435" >같은 색에서도 밝기 조절 가능</text><circle cx="470" cy="115" r="15" fill="#faf9f4" stroke="#31536d" stroke-width="3"/><path d="M470 230V292" class="arrow logic"/><text x="520" y="251" >두 값을 함께 확인</text><text x="450" y="478" text-anchor="middle" class="small">원리 개념도 · 시공도면 아님</text></svg>