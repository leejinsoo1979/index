<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" role="img" aria-labelledby="title desc"><title id="title">전기배선 계획</title><desc id="desc">생활 요구에서 제어 그룹과 설비 공간을 검토하고 전기 전문 설계의 안전 경계를 통과해 관리 자료로 이어지는 흐름</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#31536d"/></marker><linearGradient id="glow"><stop stop-color="#ffcf59" stop-opacity=".65"/><stop offset="1" stop-color="#ffcf59" stop-opacity=".06"/></linearGradient></defs><rect width="900" height="500" fill="#faf9f4"/><style>text{font-family:'Apple SD Gothic Neo','Noto Sans KR',sans-serif;font-size:19px;fill:#253d4a}.small{font-size:16px}.thin{stroke:#7c8c93;stroke-width:2;fill:none}.arrow{stroke:#31536d;stroke-width:2.5;fill:none;marker-end:url(#a)}.logic{stroke-dasharray:7 5}.surface{fill:#e5e9e7;stroke:#647b83;stroke-width:2}</style><circle cx="125" cy="172" r="52" fill="#efe1bf" stroke="#55727e" stroke-width="2"/><text x="89" y="169" >생활</text><text x="89" y="196" >요구</text><path d="M180 171L291 134" class="arrow "/><path d="M180 196L291 293" class="arrow "/><rect x="300" y="90" width="169" height="78" rx="5" fill="#e1e8eb" stroke="#647b83" stroke-width="2"/><text x="327" y="137" >제어 그룹</text><rect x="300" y="264" width="169" height="80" rx="5" fill="#e1e8eb" stroke="#647b83" stroke-width="2"/><text x="327" y="312" >설비 공간</text><path d="M550 58V407" stroke="#b07352" stroke-width="5" stroke-dasharray="10 8"/><text x="491" y="437" >전문 검토 경계</text><path d="M473 131L665 200" class="arrow "/><path d="M473 302L665 232" class="arrow "/><circle cx="720" cy="218" r="57" fill="#dce8df" stroke="#55727e" stroke-width="2"/><text x="682" y="212" >전기</text><text x="682" y="240" >설계</text><path d="M720 279V340" class="arrow "/><rect x="649" y="351" width="144" height="58" rx="5" fill="#e7e8de" stroke="#647b83" stroke-width="2"/><text x="673" y="387" >관리 자료</text><text x="82" y="375" >빛·조작점·점검 조건</text><text x="450" y="478" text-anchor="middle" class="small">원리 개념도 · 시공도면 아님</text></svg>