<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" role="img" aria-labelledby="title desc"><title id="title">스마트홈 제어</title><desc id="desc">수동 입력과 자동 조건이 장면 판단에 모이고 조명과 커튼에 서로 다른 목표 상태를 전달하는 논리</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#31536d"/></marker><linearGradient id="glow"><stop stop-color="#ffcf59" stop-opacity=".65"/><stop offset="1" stop-color="#ffcf59" stop-opacity=".06"/></linearGradient></defs><rect width="900" height="500" fill="#faf9f4"/><style>text{font-family:'Apple SD Gothic Neo','Noto Sans KR',sans-serif;font-size:19px;fill:#253d4a}.small{font-size:16px}.thin{stroke:#7c8c93;stroke-width:2;fill:none}.arrow{stroke:#31536d;stroke-width:2.5;fill:none;marker-end:url(#a)}.logic{stroke-dasharray:7 5}.surface{fill:#e5e9e7;stroke:#647b83;stroke-width:2}</style><circle cx="130" cy="126" r="45" fill="#dbeaf0" stroke="#55727e" stroke-width="2"/><text x="98" y="132" >스위치</text><circle cx="130" cy="275" r="45" fill="#dbeaf0" stroke="#55727e" stroke-width="2"/><text x="109" y="281" >앱</text><circle cx="130" cy="397" r="36" fill="#dbeaf0" stroke="#55727e" stroke-width="2"/><text x="111" y="403" >조건</text><circle cx="417" cy="250" r="80" fill="#e3dfec" stroke="#55727e" stroke-width="2"/><text x="380" y="247" >장면</text><text x="380" y="275" >판단</text><path d="M175 126L345 202" class="arrow "/><path d="M175 275L334 260" class="arrow "/><path d="M162 380L360 309" class="arrow logic"/><path d="M496 225L667 148" class="arrow "/><path d="M496 277L667 351" class="arrow "/><path d="M680 107H800M700 107V127M785 107V127" stroke="#687e88" stroke-width="5"/><path d="M705 135L670 220H815L780 135Z" fill="#f4cf78" opacity=".6"/><path d="M685 295H810V410H685ZM740 295V410M756 295V410" class="thin"/><text x="700" y="250" >조명 상태</text><text x="688" y="438" >커튼 상태</text><text x="245" y="88" >입력</text><text x="535" y="151" >목표 전달</text><text x="450" y="478" text-anchor="m