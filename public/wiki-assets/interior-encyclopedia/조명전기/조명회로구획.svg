<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" role="img" aria-labelledby="title desc"><title id="title">조명 회로 구획</title><desc id="desc">평면에서 바탕빛, 작업빛, 커튼빛의 세 제어 구획을 구분하고 휴식 장면이 일부만 선택하는 논리</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#31536d"/></marker><linearGradient id="glow"><stop stop-color="#ffcf59" stop-opacity=".65"/><stop offset="1" stop-color="#ffcf59" stop-opacity=".06"/></linearGradient></defs><rect width="900" height="500" fill="#faf9f4"/><style>text{font-family:'Apple SD Gothic Neo','Noto Sans KR',sans-serif;font-size:19px;fill:#253d4a}.small{font-size:16px}.thin{stroke:#7c8c93;stroke-width:2;fill:none}.arrow{stroke:#31536d;stroke-width:2.5;fill:none;marker-end:url(#a)}.logic{stroke-dasharray:7 5}.surface{fill:#e5e9e7;stroke:#647b83;stroke-width:2}</style><rect x="70" y="65" width="540" height="350" rx="5" fill="#f2f2e9" stroke="#647b83" stroke-width="2"/><path d="M235 65V415M70 250H610" class="thin"/><rect x="98" y="95" width="480" height="119" rx="20" fill="#f8e6ac" fill-opacity=".7" stroke="#bf9a43" stroke-dasharray="7 4"/><rect x="270" y="275" width="170" height="105" rx="16" fill="#c4e1eb" fill-opacity=".8" stroke="#4d8ca3" stroke-dasharray="7 4"/><rect x="530" y="273" width="48" height="115" fill="#ead3c1" stroke="#a57554"/><text x="280" y="153" >바탕빛</text><text x="302" y="333" >작업빛</text><text x="490" y="443" >커튼빛</text><circle cx="730" cy="251" r="69" fill="#e1dfed" stroke="#55727e" stroke-width="2"/><text x="692" y="247" >휴식</text><text x="692" y="274" >장면</text><path d="M670 214L580 170" class="arrow logic"/><path d="M670 291L580 329" class="arrow logic"/><text x="654" y="370" >선택 조합</text><text x="110" y="443" >공간의 제어 구획</text><text x="450" y="478" text-anchor="middle" class="small">원리 개념도 · 시공도면 아님</text></svg>