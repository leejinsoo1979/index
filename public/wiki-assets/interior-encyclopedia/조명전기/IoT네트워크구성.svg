<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" role="img" aria-labelledby="title desc"><title id="title">IoT 네트워크 구성</title><desc id="desc">실내 통신 영역 안의 휴대전화와 제어기, 별도 인터넷 서비스의 의존 관계를 구분한 구성도</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#31536d"/></marker><linearGradient id="glow"><stop stop-color="#ffcf59" stop-opacity=".65"/><stop offset="1" stop-color="#ffcf59" stop-opacity=".06"/></linearGradient></defs><rect width="900" height="500" fill="#faf9f4"/><style>text{font-family:'Apple SD Gothic Neo','Noto Sans KR',sans-serif;font-size:19px;fill:#253d4a}.small{font-size:16px}.thin{stroke:#7c8c93;stroke-width:2;fill:none}.arrow{stroke:#31536d;stroke-width:2.5;fill:none;marker-end:url(#a)}.logic{stroke-dasharray:7 5}.surface{fill:#e5e9e7;stroke:#647b83;stroke-width:2}</style><rect x="65" y="185" width="755" height="250" rx="30" fill="#eef2ed" stroke="#8b9d91" stroke-dasharray="8 6"/><text x="92" y="418" >실내 통신 영역</text><rect x="115" y="244" width="58" height="93" rx="9" fill="#dbe7ee" stroke="#647b83" stroke-width="2"/><text x="95" y="366" >휴대전화</text><circle cx="430" cy="293" r="50" fill="#dbe7ee" stroke="#55727e" stroke-width="2"/><text x="399" y="299" >공유기</text><rect x="665" y="254" width="104" height="75" rx="5" fill="#dbe7ee" stroke="#647b83" stroke-width="2"/><text x="687" y="299" >제어기</text><path d="M179 285H374" class="arrow "/><path d="M482 285H658" class="arrow "/><text x="235" y="266" >등록·상태</text><text x="524" y="266" >명령·상태</text><path d="M348 115C303 114 305 68 341 65C351 20 414 22 429 55C477 35 513 75 492 106C478 125 370 122 348 115Z" fill="#e8dfee" stroke="#8c7c9a" stroke-width="2"/><text x="352" y="91" >외부 서비스</text><path d="M430 242V134" class="arrow logic"/><text x="460" y="166" >인터넷 의존</text><text x="543" y="386" >기능별 지원 여부 확인</text><text x="450" y="478" text-anchor="middle" class="small">원리 개념도 · 시공도면 아님</text></svg>