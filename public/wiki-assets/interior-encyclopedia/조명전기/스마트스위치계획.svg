<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" role="img" aria-labelledby="title desc"><title id="title">스마트 스위치 계획</title><desc id="desc">현관과 침실 출입부의 사용자 동선 옆 버튼이 같은 거실 조명 상태를 요청하는 논리</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#31536d"/></marker><linearGradient id="glow"><stop stop-color="#ffcf59" stop-opacity=".65"/><stop offset="1" stop-color="#ffcf59" stop-opacity=".06"/></linearGradient></defs><rect width="900" height="500" fill="#faf9f4"/><style>text{font-family:'Apple SD Gothic Neo','Noto Sans KR',sans-serif;font-size:19px;fill:#253d4a}.small{font-size:16px}.thin{stroke:#7c8c93;stroke-width:2;fill:none}.arrow{stroke:#31536d;stroke-width:2.5;fill:none;marker-end:url(#a)}.logic{stroke-dasharray:7 5}.surface{fill:#e5e9e7;stroke:#647b83;stroke-width:2}</style><path d="M75 95H820V410H75Z M75 270H245V410M580 95V228H820" class="thin"/><path d="M133 367L174 324L312 324L420 265L621 173" stroke="#c9954c" stroke-width="6" fill="none" marker-end="url(#a)"/><text x="87" y="445" >현관</text><text x="650" y="73" >침실 출입부</text><circle cx="225" cy="275" r="18" fill="#d1e3ea" stroke="#55727e" stroke-width="2"/><circle cx="602" cy="223" r="18" fill="#d1e3ea" stroke="#55727e" stroke-width="2"/><rect x="363" y="117" width="140" height="22" rx="5" fill="#f2cf72" stroke="#647b83" stroke-width="2"/><path d="M380 147L340 230H528L487 147Z" fill="#f2cf72" opacity=".25"/><path d="M243 265L395 151" class="arrow logic"/><path d="M585 211L482 153" class="arrow logic"/><text x="320" y="89" >같은 거실 조명</text><text x="299" y="389" >동선</text><text x="586" y="324" >분산된 조작점</text><text x="526" y="360" >점선 = 명령 관계</text><text x="450" y="478" text-anchor="middle" class="small">원리 개념도 · 시공도면 아님</text></svg>