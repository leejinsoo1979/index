<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" role="img" aria-labelledby="title desc"><title id="title">LED 전원장치</title><desc id="desc">에너지가 전원 변환 기능을 거쳐 LED의 빛이 되는 흐름과 별도로 확보된 점검 공간</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#31536d"/></marker><linearGradient id="glow"><stop stop-color="#ffcf59" stop-opacity=".65"/><stop offset="1" stop-color="#ffcf59" stop-opacity=".06"/></linearGradient></defs><rect width="900" height="500" fill="#faf9f4"/><style>text{font-family:'Apple SD Gothic Neo','Noto Sans KR',sans-serif;font-size:19px;fill:#253d4a}.small{font-size:16px}.thin{stroke:#7c8c93;stroke-width:2;fill:none}.arrow{stroke:#31536d;stroke-width:2.5;fill:none;marker-end:url(#a)}.logic{stroke-dasharray:7 5}.surface{fill:#e5e9e7;stroke:#647b83;stroke-width:2}</style><path d="M75 244C105 169 130 319 159 244S214 319 243 244" stroke="#8c9ca1" fill="none" stroke-width="5"/><text x="96" y="342" >공급 전원</text><path d="M254 244H339" class="arrow "/><rect x="350" y="175" width="185" height="140" rx="16" fill="#e0e7ea" stroke="#647b83" stroke-width="2"/><text x="398" y="237" >전원</text><text x="398" y="267" >변환</text><path d="M543 244H658" class="arrow "/><rect x="681" y="224" width="106" height="21" rx="5" fill="#e9bf55" stroke="#647b83" stroke-width="2"/><path d="M683 253L639 344H830L788 253Z" fill="#e9bf55" opacity=".32"/><text x="689" y="385" >LED 발광부</text><rect x="324" y="131" width="238" height="227" rx="23" fill="none" stroke="#8f9774" stroke-width="2" stroke-dasharray="7 5"/><text x="322" y="104" >점검 공간 확보</text><path d="M442 376V414" class="arrow logic"/><text x="307" y="439" >전문가의 점검·교체 접근</text><text x="450" y="478" text-anchor="middle" class="small">원리 개념도 · 시공도면 아님</text></svg>