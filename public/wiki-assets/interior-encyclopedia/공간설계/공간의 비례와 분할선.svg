<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="title desc"><title id="title">공간의 비례와 분할선</title><desc id="desc">공간설계 원리를 설명하는 축척 없는 개념도. 구체적인 시공 치수나 구조 상세가 아님.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#287d70"/></marker></defs><rect width="900" height="520" fill="#fffdf8"/><g font-family="Apple SD Gothic Neo, Malgun Gothic, sans-serif"><text x="36" y="40" font-size="24" text-anchor="start" fill="#203b36">공간의 비례와 분할선</text><rect x="45" y="120" width="355" height="270" rx="5" fill="none" stroke="#47645e" stroke-width="2" /><rect x="500" y="120" width="355" height="270" rx="5" fill="none" stroke="#47645e" stroke-width="2" /><text x="222" y="95" font-size="20" text-anchor="middle" fill="#203b36">경계가 제각각</text><text x="678" y="95" font-size="20" text-anchor="middle" fill="#203b36">중요한 끝선의 관계 정리</text><rect x="75" y="215" width="70" height="175" rx="5" fill="#e0e6dc" stroke="#47645e" stroke-width="2" /><rect x="150" y="160" width="105" height="230" rx="5" fill="#ece2d0" stroke="#47645e" stroke-width="2" /><rect x="275" y="245" width="90" height="145" rx="5" fill="#c7d8d2" stroke="#47645e" stroke-width="2" /><path d="M 60 215 L 385 215" fill="none" stroke="#b78161" stroke-width="3" stroke-dasharray="5 5" /><path d="M 60 160 L 385 160" fill="none" stroke="#b78161" stroke-width="3" stroke-dasharray="5 5" /><path d="M 60 245 L 385 245" fill="none" stroke="#b78161" stroke-width="3" stroke-dasharray="5 5" /><rect x="530" y="200" width="70" height="190" rx="5" fill="#e0e6dc" stroke="#47645e" stroke-width="2" /><rect x="615" y="200" width="105" height="190" rx="5" fill="#ece2d0" stroke="#47645e" stroke-width="2" /><rect x="740" y="200" width="80" height="190" rx="5" fill="#c7d8d2" stroke="#47645e" stroke-width="2" /><path d="M 515 200 L 840 200" fill="none" stroke="#287d70" stroke-width="3" stroke-dasharray="6 5" /><text x="222" y="430" font-size="18" text-anchor="middle" fill="#203b36">작은 분절이 먼저 읽힘</text><text x="678" y="430" font-size="18" text-anchor="middle" fill="#203b36">큰 면과 기준선이 먼저 읽힘</text><text x="865" y="495" font-size="17" text-anchor="end" fill="#60746e">개념도 · 축척 없음</text></g></svg>