<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="title desc"><title id="title">레이아웃 설계</title><desc id="desc">공간설계 원리를 설명하는 축척 없는 개념도. 구체적인 시공 치수나 구조 상세가 아님.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#287d70"/></marker></defs><rect width="900" height="520" fill="#fffdf8"/><g font-family="Apple SD Gothic Neo, Malgun Gothic, sans-serif"><text x="36" y="40" font-size="24" text-anchor="start" fill="#203b36">레이아웃 설계</text><rect x="45" y="80" width="810" height="355" rx="5" fill="none" stroke="#47645e" stroke-width="2" /><rect x="65" y="100" width="55" height="110" rx="5" fill="#586b64" stroke="#47645e" stroke-width="2" /><text x="146" y="90" font-size="17" text-anchor="start" fill="#203b36">고정 조건</text><rect x="145" y="115" width="240" height="100" rx="5" fill="#edf2f1" stroke="#47645e" stroke-width="2" /><text x="265" y="172" font-size="20" text-anchor="middle" fill="#203b36">조리·식사</text><rect x="485" y="115" width="285" height="100" rx="5" fill="#edf2f1" stroke="#47645e" stroke-width="2" /><text x="628" y="172" font-size="20" text-anchor="middle" fill="#203b36">휴식</text><rect x="150" y="310" width="235" height="90" rx="5" fill="#edf2f1" stroke="#47645e" stroke-width="2" /><text x="268" y="362" font-size="20" text-anchor="middle" fill="#203b36">개인 영역</text><rect x="485" y="310" width="285" height="90" rx="5" fill="#edf2f1" stroke="#47645e" stroke-width="2" /><text x="628" y="362" font-size="20" text-anchor="middle" fill="#203b36">수납·생활</text><path d="M 75 280 L 440 280 L 440 165 L 480 165" fill="none" stroke="#287d70" stroke-width="4"  marker-end="url(#arrow)"/><path d="M 440 280 L 440 355 L 480 355" fill="none" stroke="#287d70" stroke-width="4"  marker-end="url(#arrow)"/><text x="263" y="266" font-size="17" text-anchor="middle" fill="#203b36">연결 경로</text><text x="632" y="271" font-size="18" text-anchor="middle" fill="#203b36">기능과 이동을 함께 조정</text><text x="75" y="460" font-size="18" text-anchor="middle" fill="#203b36">진입</text><text x="865" y="495" font-size="17" text-anchor="end" fill="#60746e">개념도 · 축척 없음</text></g></svg>