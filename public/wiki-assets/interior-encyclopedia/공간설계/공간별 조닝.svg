<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="title desc"><title id="title">공간별 조닝</title><desc id="desc">공간설계 원리를 설명하는 축척 없는 개념도. 구체적인 시공 치수나 구조 상세가 아님.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#287d70"/></marker></defs><rect width="900" height="520" fill="#fffdf8"/><g font-family="Apple SD Gothic Neo, Malgun Gothic, sans-serif"><text x="36" y="40" font-size="24" text-anchor="start" fill="#203b36">공간별 조닝</text><rect x="60" y="180" width="220" height="165" rx="5" fill="#ead2a6" stroke="#47645e" stroke-width="2" /><text x="170" y="240" font-size="20" text-anchor="middle" fill="#203b36">공용 영역</text><text x="170" y="280" font-size="18" text-anchor="middle" fill="#203b36">식사·대화</text><rect x="375" y="195" width="155" height="135" rx="5" fill="#d8e2d6" stroke="#47645e" stroke-width="2" /><text x="453" y="250" font-size="20" text-anchor="middle" fill="#203b36">완충·접근</text><text x="453" y="285" font-size="17" text-anchor="middle" fill="#203b36">선택적 연결</text><rect x="655" y="90" width="185" height="135" rx="5" fill="#c7d8d2" stroke="#47645e" stroke-width="2" /><text x="748" y="145" font-size="20" text-anchor="middle" fill="#203b36">개인 영역</text><text x="748" y="180" font-size="18" text-anchor="middle" fill="#203b36">수면·집중</text><rect x="655" y="300" width="185" height="135" rx="5" fill="#dedacb" stroke="#47645e" stroke-width="2" /><text x="748" y="353" font-size="20" text-anchor="middle" fill="#203b36">생활 영역</text><text x="748" y="390" font-size="18" text-anchor="middle" fill="#203b36">세탁·수납</text><path d="M 285 262 L 365 262" fill="none" stroke="#287d70" stroke-width="4"  marker-end="url(#arrow)"/><path d="M 535 240 L 595 240 L 595 157 L 645 157" fill="none" stroke="#287d70" stroke-width="4"  marker-end="url(#arrow)"/><path d="M 535 285 L 595 285 L 595 367 L 645 367" fill="none" stroke="#287d70" stroke-width="4"  marker-end="url(#arrow)"/><text x="248" y="120" font-size="20" text-anchor="middle" fill="#203b36">활동의 성격과 인접 관계부터 설정</text><text x="350" y="425" font-size="18" text-anchor="middle" fill="#203b36">방 이름보다 생활 기능을 기준으로</text><text x="865" y="495" font-size="17" text-anchor="end" fill="#60746e">개념도 · 축척 없음</text></g></svg>