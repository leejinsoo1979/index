<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="title desc"><title id="title">현관 전이공간</title><desc id="desc">공간설계 원리를 설명하는 축척 없는 개념도. 구체적인 시공 치수나 구조 상세가 아님.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#287d70"/></marker></defs><rect width="900" height="520" fill="#fffdf8"/><g font-family="Apple SD Gothic Neo, Malgun Gothic, sans-serif"><text x="36" y="40" font-size="24" text-anchor="start" fill="#203b36">현관 전이공간</text><rect x="55" y="100" width="790" height="325" rx="5" fill="none" stroke="#47645e" stroke-width="2" /><rect x="265" y="110" width="255" height="80" rx="5" fill="#c7d8d2" stroke="#47645e" stroke-width="2" /><text x="393" y="157" font-size="20" text-anchor="middle" fill="#203b36">신발장</text><rect x="85" y="210" width="380" height="175" rx="5" fill="#f2e5ce" stroke="#47645e" stroke-width="2" /><text x="160" y="245" font-size="18" text-anchor="middle" fill="#203b36">신발 영역</text><circle cx="200" cy="325" r="17" fill="#d0a35f"/><text x="200" y="365" font-size="18" text-anchor="middle" fill="#203b36">벗기</text><circle cx="395" cy="245" r="17" fill="#287d70"/><text x="395" y="282" font-size="18" text-anchor="middle" fill="#203b36">보관</text><text x="685" y="200" font-size="20" text-anchor="middle" fill="#203b36">실내</text><path d="M 80 325 L 175 325" fill="none" stroke="#287d70" stroke-width="4"  marker-end="url(#arrow)"/><path d="M 225 320 L 370 255" fill="none" stroke="#287d70" stroke-width="4"  marker-end="url(#arrow)"/><path d="M 420 255 L 550 310 L 790 310" fill="none" stroke="#287d70" stroke-width="4"  marker-end="url(#arrow)"/><path d="M 550 110 L 550 240" fill="none" stroke="#7e8e87" stroke-width="3"  /><text x="650" y="100" font-size="17" text-anchor="middle" fill="#203b36">부분 가림</text><text x="450" y="460" font-size="19" text-anchor="middle" fill="#203b36">수납 행동이 실내 진입과 자연스럽게 이어지게</text><text x="865" y="495" font-size="17" text-anchor="end" fill="#60746e">개념도 · 축척 없음</text></g></svg>