<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="title desc"><title id="title">유지관리 중심 설계</title><desc id="desc">공간설계 원리를 설명하는 축척 없는 개념도. 구체적인 시공 치수나 구조 상세가 아님.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#287d70"/></marker></defs><rect width="900" height="520" fill="#fffdf8"/><g font-family="Apple SD Gothic Neo, Malgun Gothic, sans-serif"><text x="36" y="40" font-size="24" text-anchor="start" fill="#203b36">유지관리 중심 설계</text><text x="235" y="95" font-size="20" text-anchor="middle" fill="#203b36">보수 범위가 얽힘</text><text x="675" y="95" font-size="20" text-anchor="middle" fill="#203b36">보수 단위 구분</text><rect x="70" y="150" width="320" height="200" rx="5" fill="#e4e8db" stroke="#47645e" stroke-width="2" /><rect x="115" y="180" width="230" height="150" rx="5" fill="#e4d5be" stroke="#47645e" stroke-width="2" /><rect x="170" y="210" width="120" height="100" rx="5" fill="#d7b693" stroke="#47645e" stroke-width="2" /><circle cx="228" cy="255" r="15" fill="#a65b47"/><path d="M 230 255 L 140 180" fill="none" stroke="#287d70" stroke-width="4"  marker-end="url(#arrow)"/><path d="M 230 255 L 355 155" fill="none" stroke="#287d70" stroke-width="4"  marker-end="url(#arrow)"/><text x="235" y="395" font-size="18" text-anchor="middle" fill="#203b36">한 부위 → 주변까지 개입</text><rect x="510" y="150" width="320" height="200" rx="5" fill="#e4e8db" stroke="#47645e" stroke-width="2" /><rect x="555" y="180" width="230" height="150" rx="5" fill="#e4d5be" stroke="#47645e" stroke-width="2" /><rect x="610" y="210" width="120" height="100" rx="5" fill="#d7b693" stroke="#47645e" stroke-width="2" /><rect x="598" y="198" width="144" height="124" rx="5" fill="none" stroke="#287d70" stroke-width="2" stroke-dasharray="6 5"/><circle cx="670" cy="255" r="15" fill="#a65b47"/><path d="M 670 255 L 715 255" fill="none" stroke="#287d70" stroke-width="4"  marker-end="url(#arrow)"/><text x="675" y="395" font-size="18" text-anchor="middle" fill="#203b36">필요한 단위에서 접근·복구</text><text x="450" y="450" font-size="18" text-anchor="middle" fill="#203b36">점선: 계획한 보수 경계</text><text x="865" y="495" font-size="17" text-anchor="end" fill="#60746e">개념도 · 축척 없음</text></g></svg>