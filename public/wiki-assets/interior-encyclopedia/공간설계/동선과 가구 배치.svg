<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="title desc"><title id="title">동선과 가구 배치</title><desc id="desc">공간설계 원리를 설명하는 축척 없는 개념도. 구체적인 시공 치수나 구조 상세가 아님.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#287d70"/></marker></defs><rect width="900" height="520" fill="#fffdf8"/><g font-family="Apple SD Gothic Neo, Malgun Gothic, sans-serif"><text x="36" y="40" font-size="24" text-anchor="start" fill="#203b36">동선과 가구 배치</text><rect x="60" y="95" width="780" height="335" rx="5" fill="none" stroke="#47645e" stroke-width="2" /><rect x="140" y="165" width="230" height="135" rx="5" fill="#ead2a6" stroke="#47645e" stroke-width="2" /><text x="255" y="237" font-size="20" text-anchor="middle" fill="#203b36">식탁</text><rect x="100" y="125" width="310" height="215" rx="5" fill="none" stroke="#9a8a6f" stroke-width="2" stroke-dasharray="7 6"/><rect x="590" y="145" width="205" height="85" rx="5" fill="#edf2f1" stroke="#47645e" stroke-width="2" /><text x="691" y="196" font-size="20" text-anchor="middle" fill="#203b36">수납장</text><rect x="570" y="130" width="245" height="175" rx="5" fill="none" stroke="#9a8a6f" stroke-width="2" stroke-dasharray="7 6"/><path d="M 80 390 L 465 390 L 465 110" fill="none" stroke="#287d70" stroke-width="4"  marker-end="url(#arrow)"/><text x="255" y="365" font-size="18" text-anchor="middle" fill="#203b36">의자 사용 영역</text><text x="693" y="288" font-size="18" text-anchor="middle" fill="#203b36">문 열림·사용 영역</text><text x="531" y="350" font-size="18" text-anchor="middle" fill="#203b36">이동은 점유 면적 밖에서 검토</text><text x="450" y="462" font-size="19" text-anchor="middle" fill="#203b36">빈틈이 있다고 곧 통로가 되는 것은 아님</text><text x="865" y="495" font-size="17" text-anchor="end" fill="#60746e">개념도 · 축척 없음</text></g></svg>