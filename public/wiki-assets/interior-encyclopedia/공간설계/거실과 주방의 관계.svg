<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="title desc"><title id="title">거실과 주방의 관계</title><desc id="desc">공간설계 원리를 설명하는 축척 없는 개념도. 구체적인 시공 치수나 구조 상세가 아님.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#287d70"/></marker></defs><rect width="900" height="520" fill="#fffdf8"/><g font-family="Apple SD Gothic Neo, Malgun Gothic, sans-serif"><text x="36" y="40" font-size="24" text-anchor="start" fill="#203b36">거실과 주방의 관계</text><rect x="70" y="110" width="235" height="250" rx="5" fill="#edf2f1" stroke="#47645e" stroke-width="2" /><rect x="345" y="175" width="210" height="120" rx="5" fill="#ead2a6" stroke="#47645e" stroke-width="2" /><rect x="610" y="110" width="220" height="250" rx="5" fill="#e0e6dc" stroke="#47645e" stroke-width="2" /><text x="188" y="160" font-size="20" text-anchor="middle" fill="#203b36">주방</text><rect x="100" y="210" width="175" height="70" rx="5" fill="#b6ccc5" stroke="#47645e" stroke-width="2" /><text x="188" y="252" font-size="18" text-anchor="middle" fill="#203b36">작업대</text><text x="450" y="243" font-size="20" text-anchor="middle" fill="#203b36">식탁</text><text x="720" y="220" font-size="20" text-anchor="middle" fill="#203b36">거실·휴식</text><path d="M 275 245 L 337 245" fill="none" stroke="#287d70" stroke-width="4"  marker-end="url(#arrow)"/><text x="321" y="300" font-size="17" text-anchor="middle" fill="#203b36">배식</text><path d="M 220 130 L 720 130" fill="none" stroke="#287d70" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#arrow)"/><text x="485" y="110" font-size="18" text-anchor="middle" fill="#203b36">시야·대화</text><path d="M 800 400 L 570 400 L 570 330 L 350 330 L 350 400 L 100 400" fill="none" stroke="#287d70" stroke-width="4"  marker-end="url(#arrow)"/><text x="450" y="452" font-size="19" text-anchor="middle" fill="#203b36">공용 이동과 조리·배식의 충돌도 확인</text><text x="865" y="495" font-size="17" text-anchor="end" fill="#60746e">개념도 · 축척 없음</text></g></svg>