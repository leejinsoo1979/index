<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="title desc"><title id="title">시선축과 초점벽</title><desc id="desc">공간설계 원리를 설명하는 축척 없는 개념도. 구체적인 시공 치수나 구조 상세가 아님.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#287d70"/></marker></defs><rect width="900" height="520" fill="#fffdf8"/><g font-family="Apple SD Gothic Neo, Malgun Gothic, sans-serif"><text x="36" y="40" font-size="24" text-anchor="start" fill="#203b36">시선축과 초점벽</text><rect x="55" y="100" width="355" height="315" rx="5" fill="none" stroke="#47645e" stroke-width="2" /><rect x="490" y="100" width="355" height="315" rx="5" fill="none" stroke="#47645e" stroke-width="2" /><text x="230" y="85" font-size="18" text-anchor="middle" fill="#203b36">가까운 가구가 시야 차단</text><text x="670" y="85" font-size="18" text-anchor="middle" fill="#203b36">끝벽까지 시선 연결</text><rect x="190" y="175" width="65" height="170" rx="5" fill="#b9b7ae" stroke="#47645e" stroke-width="2" /><rect x="625" y="120" width="65" height="100" rx="5" fill="#b9b7ae" stroke="#47645e" stroke-width="2" /><path d="M 100 365 L 190 235" fill="none" stroke="#287d70" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow)"/><path d="M 535 365 L 799 153" fill="none" stroke="#287d70" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow)"/><rect x="780" y="120" width="35" height="175" rx="5" fill="#e2b973" stroke="#47645e" stroke-width="2" /><text x="747" y="325" font-size="19" text-anchor="middle" fill="#203b36">초점벽</text><circle cx="100" cy="365" r="9" fill="#287d70"/><circle cx="535" cy="365" r="9" fill="#287d70"/><text x="100" y="448" font-size="18" text-anchor="middle" fill="#203b36">진입 시점</text><text x="535" y="448" font-size="18" text-anchor="middle" fill="#203b36">진입 시점</text><text x="230" y="390" font-size="17" text-anchor="middle" fill="#203b36">시야가 가까이 멈춤</text><text x="695" y="390" font-size="17" text-anchor="middle" fill="#203b36">깊이를 읽음</text><text x="865" y="495" font-size="17" text-anchor="end" fill="#60746e">개념도 · 축척 없음</text></g></svg>