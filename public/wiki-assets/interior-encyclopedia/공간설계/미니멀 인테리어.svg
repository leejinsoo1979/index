<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="title desc"><title id="title">미니멀 인테리어</title><desc id="desc">공간설계 원리를 설명하는 축척 없는 개념도. 구체적인 시공 치수나 구조 상세가 아님.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#287d70"/></marker></defs><rect width="900" height="520" fill="#fffdf8"/><g font-family="Apple SD Gothic Neo, Malgun Gothic, sans-serif"><text x="36" y="40" font-size="24" text-anchor="start" fill="#203b36">미니멀 인테리어</text><text x="235" y="95" font-size="20" text-anchor="middle" fill="#203b36">반복되는 경계가 강조됨</text><text x="680" y="95" font-size="20" text-anchor="middle" fill="#203b36">필요 기능은 남기고 경계 절제</text><rect x="50" y="130" width="350" height="260" rx="5" fill="#f5f1e8" stroke="#47645e" stroke-width="2" /><rect x="500" y="130" width="350" height="260" rx="5" fill="#f5f1e8" stroke="#47645e" stroke-width="2" /><rect x="65" y="145" width="320" height="15" rx="5" fill="#8b9c91" stroke="#47645e" stroke-width="2" /><rect x="65" y="365" width="320" height="15" rx="5" fill="#8b9c91" stroke="#47645e" stroke-width="2" /><rect x="150" y="180" width="105" height="200" rx="5" fill="none" stroke="#8b9c91" stroke-width="2" /><rect x="163" y="193" width="79" height="187" rx="5" fill="#d9dfd5" stroke="#47645e" stroke-width="2" /><rect x="613" y="193" width="79" height="187" rx="5" fill="#e8e8dc" stroke="#a4afa4" stroke-width="2" /><circle cx="230" cy="285" r="4" fill="#47645e"/><circle cx="680" cy="285" r="4" fill="#47645e"/><rect x="285" y="300" width="80" height="65" rx="5" fill="#c5d8d1" stroke="#47645e" stroke-width="2" /><rect x="735" y="300" width="80" height="65" rx="5" fill="#c5d8d1" stroke="#47645e" stroke-width="2" /><text x="225" y="425" font-size="18" text-anchor="middle" fill="#203b36">문·가구 있음</text><text x="675" y="425" font-size="18" text-anchor="middle" fill="#203b36">문·가구 있음</text><text x="450" y="458" font-size="18" text-anchor="middle" fill="#203b36">물건을 없애는 것과 시각적 복잡성을 줄이는 것은 다름</text><text x="865" y="495" font-size="17" text-anchor="end" fill="#60746e">개념도 · 축척 없음</text></g></svg>