<svg xmlns="http://www.w3.org/2000/svg" width="760" height="460" viewBox="0 0 760 460" role="img" aria-labelledby="title desc"><title id="title">이종 마감재 접합 개념도</title><desc id="desc">이종 마감재 접합의 면, 경계와 구성 관계를 비교하는 도식. 실제 시공 상세가 아님.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#b35f31"/></marker></defs><rect width="760" height="460" fill="#faf9f5"/><g fill="#263e49" font-family="Apple SD Gothic Neo,Malgun Gothic,sans-serif"><text x="35" y="35" font-size="23">이종 마감재 접합</text><rect x="75" y="190" width="180" height="40" fill="#d7b899" stroke="#345361" stroke-width="2"/><rect x="265" y="165" width="110" height="65" fill="#b2cbd0" stroke="#345361" stroke-width="2"/><rect x="75" y="230" width="300" height="50" fill="#eee9df" stroke="#345361" stroke-width="2"/><text x="75" y="75" font-size="18">높이와 끝의 관계</text><path d="M180 120L258 180" fill="none" stroke="#b35f31" stroke-width="2.5" marker-end="url(#a)"/><text x="85" y="110" font-size="18">서로 다른 표면</text><text x="90" y="315" font-size="18">마감 A</text><text x="270" y="315" font-size="18">마감 B</text><rect x="460" y="190" width="85" height="45" fill="#d7b899" stroke="#345361" stroke-width="2"/><rect x="570" y="190" width="100" height="45" fill="#b2cbd0" stroke="#345361" stroke-width="2"/><path d="M545 235L570 235" fill="none" stroke="#b35f31" stroke-width="2" /><path d="M560 120L558 220" fill="none" stroke="#b35f31" stroke-width="2.5" marker-end="url(#a)"/><text x="445" y="75" font-size="18">분리와 접합 검토</text><text x="450" y="285" font-size="18">필요한 틈·실링은</text><text x="450" y="315" font-size="18">사용 조건에 따라 결정</text><text x="35" y="435" font-size="16">개념도 · 축척 없음</text></g></svg>