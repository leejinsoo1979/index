<svg xmlns="http://www.w3.org/2000/svg" width="760" height="460" viewBox="0 0 760 460" role="img" aria-labelledby="title desc"><title id="title">강마루 마감 개념도</title><desc id="desc">강마루 마감의 면, 경계와 구성 관계를 비교하는 도식. 실제 시공 상세가 아님.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#b35f31"/></marker></defs><rect width="760" height="460" fill="#faf9f5"/><g fill="#263e49" font-family="Apple SD Gothic Neo,Malgun Gothic,sans-serif"><text x="35" y="35" font-size="23">강마루 마감</text><path d="M65 285 Q120 267 175 285T285 285L285 320L65 320Z" fill="#d7b899" stroke="#345361" stroke-width="2"/><rect x="80" y="130" width="190" height="125" fill="#d9e4e5" stroke="#345361" stroke-width="2"/><text x="65" y="75" font-size="18">불균일 바닥과 가구</text><path d="M320 220L245 275" fill="none" stroke="#b35f31" stroke-width="2.5" marker-end="url(#a)"/><text x="160" y="360" font-size="18">틈 변화</text><rect x="420" y="285" width="265" height="35" fill="#d7b899" stroke="#345361" stroke-width="2"/><rect x="445" y="130" width="195" height="125" fill="#d9e4e5" stroke="#345361" stroke-width="2"/><path d="M420 270L685 270" fill="none" stroke="#b35f31" stroke-width="2" stroke-dasharray="6 5"/><path d="M570 355L570 272" fill="none" stroke="#b35f31" stroke-width="2.5" marker-end="url(#a)"/><text x="420" y="75" font-size="18">경계 상태를 함께 검토</text><text x="425" y="385" font-size="18">가구 하단과 바닥선의 관계</text><text x="35" y="435" font-size="16">개념도 · 축척 없음</text></g></svg>