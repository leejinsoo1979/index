<svg xmlns="http://www.w3.org/2000/svg" width="760" height="460" viewBox="0 0 760 460" role="img" aria-labelledby="title desc"><title id="title">히든도어 개념도</title><desc id="desc">히든도어의 면, 경계와 구성 관계를 비교하는 도식. 실제 시공 상세가 아님.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#b35f31"/></marker></defs><rect width="760" height="460" fill="#faf9f5"/><g fill="#263e49" font-family="Apple SD Gothic Neo,Malgun Gothic,sans-serif"><text x="35" y="35" font-size="23">히든도어</text><rect x="80" y="95" width="250" height="255" fill="#eee9df" stroke="#345361" stroke-width="2"/><rect x="150" y="95" width="110" height="75" fill="#d9e4e5" stroke="#345361" stroke-width="2"/><rect x="150" y="178" width="110" height="172" fill="#d9e4e5" stroke="#345361" stroke-width="2"/><text x="82" y="75" font-size="18">정면: 고정 면과 문짝</text><text x="170" y="135" font-size="18">상부</text><text x="174" y="270" font-size="18">문짝</text><path d="M290 163L240 173" fill="none" stroke="#b35f31" stroke-width="2.5" marker-end="url(#a)"/><text x="280" y="150" font-size="18">문틈</text><rect x="430" y="155" width="95" height="40" fill="#d9e4e5" stroke="#345361" stroke-width="2"/><rect x="540" y="155" width="95" height="40" fill="#d9e4e5" stroke="#345361" stroke-width="2"/><path d="M420 155L650 155" fill="none" stroke="#b35f31" stroke-width="2" stroke-dasharray="7 5"/><text x="425" y="100" font-size="18">단면: 닫힌 면 정렬</text><text x="440" y="225" font-size="18">벽</text><text x="560" y="225" font-size="18">문</text><path d="M615 300L575 160" fill="none" stroke="#b35f31" stroke-width="2.5" marker-end="url(#a)"/><text x="425" y="330" font-size="18">개폐 여유는 별도 검토</text><text x="35" y="435" font-size="16">개념도 · 축척 없음</text></g></svg>