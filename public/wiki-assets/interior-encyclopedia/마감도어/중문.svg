<svg xmlns="http://www.w3.org/2000/svg" width="760" height="460" viewBox="0 0 760 460" role="img" aria-labelledby="title desc"><title id="title">중문 개념도</title><desc id="desc">중문의 면, 경계와 구성 관계를 비교하는 도식. 실제 시공 상세가 아님.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#b35f31"/></marker></defs><rect width="760" height="460" fill="#faf9f5"/><g fill="#263e49" font-family="Apple SD Gothic Neo,Malgun Gothic,sans-serif"><text x="35" y="35" font-size="23">중문</text><rect x="65" y="110" width="270" height="230" fill="#eee9df" stroke="#345361" stroke-width="2"/><path d="M195 110L195 340" fill="none" stroke="#345361" stroke-width="2" /><path d="M195 220L275 220" fill="none" stroke="#345361" stroke-width="2" /><path d="M195 140 A80 80 0 0 1 275 220" fill="none" stroke="#b35f31" stroke-width="2.5" marker-end="url(#a)"/><text x="75" y="75" font-size="18">여닫이: 평면</text><text x="80" y="315" font-size="18">현관</text><text x="230" y="315" font-size="18">실내</text><text x="220" y="155" font-size="18">회전 범위</text><rect x="415" y="110" width="270" height="230" fill="#eee9df" stroke="#345361" stroke-width="2"/><path d="M545 110L545 340" fill="none" stroke="#345361" stroke-width="2" /><rect x="535" y="210" width="20" height="95" fill="#b2cbd0" stroke="#345361" stroke-width="2"/><path d="M585 290L585 180" fill="none" stroke="#b35f31" stroke-width="2.5" marker-end="url(#a)"/><text x="415" y="75" font-size="18">미닫이: 평면</text><text x="590" y="245" font-size="18">이동</text><text x="420" y="370" font-size="18">옆 공간과 점검 접근 검토</text><text x="35" y="435" font-size="16">개념도 · 축척 없음</text></g></svg>