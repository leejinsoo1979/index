<svg xmlns="http://www.w3.org/2000/svg" width="760" height="460" viewBox="0 0 760 460" role="img" aria-labelledby="title desc"><title id="title">무몰딩 마감 개념도</title><desc id="desc">무몰딩 마감의 면, 경계와 구성 관계를 비교하는 도식. 실제 시공 상세가 아님.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#b35f31"/></marker></defs><rect width="760" height="460" fill="#faf9f5"/><g fill="#263e49" font-family="Apple SD Gothic Neo,Malgun Gothic,sans-serif"><text x="35" y="35" font-size="23">무몰딩 마감</text><rect x="80" y="100" width="40" height="220" fill="#d9e4e5" stroke="#345361" stroke-width="2"/><rect x="80" y="100" width="210" height="28" fill="#d9e4e5" stroke="#345361" stroke-width="2"/><rect x="120" y="128" width="42" height="30" fill="#d7b899" stroke="#345361" stroke-width="2"/><text x="80" y="75" font-size="18">돌출 몰딩 경계</text><path d="M220 195L155 150" fill="none" stroke="#b35f31" stroke-width="2.5" marker-end="url(#a)"/><rect x="440" y="100" width="40" height="220" fill="#d9e4e5" stroke="#345361" stroke-width="2"/><rect x="440" y="100" width="210" height="28" fill="#d9e4e5" stroke="#345361" stroke-width="2"/><path d="M480 128L493 128" fill="none" stroke="#b35f31" stroke-width="2" /><text x="440" y="75" font-size="18">면과 접합선 정리</text><path d="M590 200L488 130" fill="none" stroke="#b35f31" stroke-width="2.5" marker-end="url(#a)"/><text x="95" y="350" font-size="18">벽</text><text x="460" y="350" font-size="18">벽</text><text x="155" y="285" font-size="18">천장과 벽 단면</text><text x="525" y="285" font-size="18">천장과 벽 단면</text><text x="35" y="435" font-size="16">개념도 · 축척 없음</text></g></svg>