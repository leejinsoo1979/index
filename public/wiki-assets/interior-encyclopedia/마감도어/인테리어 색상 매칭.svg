<svg xmlns="http://www.w3.org/2000/svg" width="760" height="460" viewBox="0 0 760 460" role="img" aria-labelledby="title desc"><title id="title">인테리어 색상 매칭 개념도</title><desc id="desc">인테리어 색상 매칭의 면, 경계와 구성 관계를 비교하는 도식. 실제 시공 상세가 아님.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#b35f31"/></marker></defs><rect width="760" height="460" fill="#faf9f5"/><g fill="#263e49" font-family="Apple SD Gothic Neo,Malgun Gothic,sans-serif"><text x="35" y="35" font-size="23">인테리어 색상 매칭</text><rect x="75" y="115" width="100" height="180" fill="#ece8df" stroke="#345361" stroke-width="2"/><rect x="175" y="115" width="100" height="180" fill="#deded9" stroke="#345361" stroke-width="2"/><rect x="75" y="295" width="200" height="35" fill="#be9a75" stroke="#345361" stroke-width="2"/><text x="75" y="75" font-size="18">우연한 색 차이</text><text x="85" y="215" font-size="18">벽</text><text x="185" y="215" font-size="18">문</text><path d="M315 170L230 170" fill="none" stroke="#b35f31" stroke-width="2.5" marker-end="url(#a)"/><rect x="435" y="115" width="100" height="180" fill="#e5e1d7" stroke="#345361" stroke-width="2"/><rect x="535" y="115" width="100" height="180" fill="#e8e4da" stroke="#345361" stroke-width="2"/><rect x="435" y="295" width="200" height="35" fill="#be9a75" stroke="#345361" stroke-width="2"/><text x="435" y="75" font-size="18">배경의 관계 조정</text><text x="445" y="215" font-size="18">벽</text><text x="545" y="215" font-size="18">문</text><path d="M670 170L595 170" fill="none" stroke="#b35f31" stroke-width="2.5" marker-end="url(#a)"/><text x="75" y="375" font-size="18">색 이름이 같아도 실제 면을 함께 비교</text><text x="35" y="435" font-size="16">개념도 · 축척 없음</text></g></svg>