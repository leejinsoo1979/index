<svg xmlns="http://www.w3.org/2000/svg" width="760" height="460" viewBox="0 0 760 460" role="img" aria-labelledby="title desc"><title id="title">스텝도어 개념도</title><desc id="desc">스텝도어의 면, 경계와 구성 관계를 비교하는 도식. 실제 시공 상세가 아님.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#b35f31"/></marker></defs><rect width="760" height="460" fill="#faf9f5"/><g fill="#263e49" font-family="Apple SD Gothic Neo,Malgun Gothic,sans-serif"><text x="35" y="35" font-size="23">스텝도어</text><rect x="90" y="105" width="50" height="215" fill="#d9e4e5" stroke="#345361" stroke-width="2"/><rect x="140" y="105" width="210" height="35" fill="#d9e4e5" stroke="#345361" stroke-width="2"/><rect x="160" y="155" width="150" height="165" fill="#d9e4e5" stroke="#345361" stroke-width="2"/><text x="90" y="75" font-size="18">문·상부·틀의 관계</text><text x="180" y="132" font-size="18">고정 헤더</text><text x="195" y="255" font-size="18">문짝</text><path d="M380 215L317 140" fill="none" stroke="#b35f31" stroke-width="2.5" marker-end="url(#a)"/><text x="345" y="245" font-size="18">주변 마감</text><rect x="480" y="120" width="35" height="190" fill="#d9e4e5" stroke="#345361" stroke-width="2"/><rect x="515" y="140" width="65" height="30" fill="#d9e4e5" stroke="#345361" stroke-width="2"/><rect x="530" y="187" width="125" height="35" fill="#d9e4e5" stroke="#345361" stroke-width="2"/><path d="M480 310L660 310" fill="none" stroke="#345361" stroke-width="2" /><path d="M620 115L563 182" fill="none" stroke="#b35f31" stroke-width="2.5" marker-end="url(#a)"/><text x="500" y="90" font-size="18">단면의 단차</text><text x="482" y="350" font-size="18">잠김 위치와 면 함께 검토</text><text x="35" y="435" font-size="16">개념도 · 축척 없음</text></g></svg>