<svg xmlns="http://www.w3.org/2000/svg" width="760" height="460" viewBox="0 0 760 460" role="img" aria-labelledby="title desc"><title id="title">걸레받이 개념도</title><desc id="desc">걸레받이의 면, 경계와 구성 관계를 비교하는 도식. 실제 시공 상세가 아님.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#b35f31"/></marker></defs><rect width="760" height="460" fill="#faf9f5"/><g fill="#263e49" font-family="Apple SD Gothic Neo,Malgun Gothic,sans-serif"><text x="35" y="35" font-size="23">걸레받이</text><rect x="80" y="105" width="35" height="195" fill="#d9e4e5" stroke="#345361" stroke-width="2"/><rect x="80" y="300" width="230" height="25" fill="#d9e4e5" stroke="#345361" stroke-width="2"/><rect x="115" y="250" width="28" height="50" fill="#d7b899" stroke="#345361" stroke-width="2"/><text x="75" y="75" font-size="18">돌출형 단면</text><path d="M245 195L142 250" fill="none" stroke="#b35f31" stroke-width="2.5" marker-end="url(#a)"/><text x="180" y="180" font-size="18">상부 턱</text><rect x="440" y="105" width="35" height="170" fill="#d9e4e5" stroke="#345361" stroke-width="2"/><rect x="420" y="300" width="240" height="25" fill="#d9e4e5" stroke="#345361" stroke-width="2"/><rect x="440" y="275" width="18" height="25" fill="#6b7b80" stroke="#345361" stroke-width="2"/><text x="425" y="75" font-size="18">음영선형 단면</text><path d="M570 230L459 286" fill="none" stroke="#b35f31" stroke-width="2.5" marker-end="url(#a)"/><text x="535" y="212" font-size="18">하단 홈</text><text x="70" y="365" font-size="18">접합부 가림</text><text x="430" y="365" font-size="18">바닥 변화·청소 접근 검토</text><text x="35" y="435" font-size="16">개념도 · 축척 없음</text></g></svg>