<svg xmlns="http://www.w3.org/2000/svg" width="760" height="460" viewBox="0 0 760 460" role="img" aria-labelledby="title desc"><title id="title">문선과 가구선 정렬 개념도</title><desc id="desc">문선과 가구선 정렬의 면, 경계와 구성 관계를 비교하는 도식. 실제 시공 상세가 아님.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#b35f31"/></marker></defs><rect width="760" height="460" fill="#faf9f5"/><g fill="#263e49" font-family="Apple SD Gothic Neo,Malgun Gothic,sans-serif"><text x="35" y="35" font-size="23">문선과 가구선 정렬</text><rect x="65" y="145" width="130" height="190" fill="#d9e4e5" stroke="#345361" stroke-width="2"/><rect x="220" y="110" width="145" height="225" fill="#d9e4e5" stroke="#345361" stroke-width="2"/><text x="65" y="75" font-size="18">엇갈린 상단</text><path d="M50 145L380 145" fill="none" stroke="#b35f31" stroke-width="2" stroke-dasharray="6 5"/><path d="M180 95L220 110" fill="none" stroke="#b35f31" stroke-width="2.5" marker-end="url(#a)"/><text x="75" y="370" font-size="18">문</text><text x="255" y="370" font-size="18">가구</text><rect x="440" y="110" width="90" height="225" fill="#d9e4e5" stroke="#345361" stroke-width="2"/><rect x="550" y="110" width="130" height="225" fill="#d9e4e5" stroke="#345361" stroke-width="2"/><text x="440" y="75" font-size="18">선 관계를 함께 계획</text><path d="M420 110L695 110" fill="none" stroke="#b35f31" stroke-width="2" stroke-dasharray="6 5"/><path d="M615 185L590 112" fill="none" stroke="#b35f31" stroke-width="2.5" marker-end="url(#a)"/><text x="450" y="370" font-size="18">문</text><text x="580" y="370" font-size="18">가구</text><text x="35" y="435" font-size="16">개념도 · 축척 없음</text></g></svg>