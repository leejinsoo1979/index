<svg xmlns="http://www.w3.org/2000/svg" width="760" height="460" viewBox="0 0 760 460" role="img" aria-labelledby="title desc"><title id="title">현관문 표면 마감 개념도</title><desc id="desc">현관문 표면 마감의 면, 경계와 구성 관계를 비교하는 도식. 실제 시공 상세가 아님.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#b35f31"/></marker></defs><rect width="760" height="460" fill="#faf9f5"/><g fill="#263e49" font-family="Apple SD Gothic Neo,Malgun Gothic,sans-serif"><text x="35" y="35" font-size="23">현관문 표면 마감</text><rect x="95" y="90" width="220" height="275" fill="#d7b899" stroke="#345361" stroke-width="2"/><rect x="110" y="105" width="190" height="245" fill="#ece5d7" stroke="#345361" stroke-width="2"/><rect x="245" y="180" width="32" height="65" fill="#66818b" stroke="#345361" stroke-width="2"/><rect x="170" y="110" width="85" height="20" fill="#66818b" stroke="#345361" stroke-width="2"/><path d="M165 350L285 350" fill="none" stroke="#b35f31" stroke-width="2" /><text x="90" y="70" font-size="18">실내에서 본 문</text><path d="M410 160L260 120" fill="none" stroke="#b35f31" stroke-width="2.5" marker-end="url(#a)"/><text x="420" y="160" font-size="18">닫힘 기능 유지</text><path d="M410 220L280 210" fill="none" stroke="#b35f31" stroke-width="2.5" marker-end="url(#a)"/><text x="420" y="220" font-size="18">잠금부 가리지 않기</text><path d="M410 290L235 280" fill="none" stroke="#b35f31" stroke-width="2.5" marker-end="url(#a)"/><text x="420" y="290" font-size="18">표면 색·재질 검토</text><path d="M410 350L270 352" fill="none" stroke="#b35f31" stroke-width="2.5" marker-end="url(#a)"/><text x="420" y="350" font-size="18">턱의 손상 확인</text><text x="35" y="435" font-size="16">개념도 · 축척 없음</text></g></svg>