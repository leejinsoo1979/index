<svg xmlns="http://www.w3.org/2000/svg" width="800" height="550" viewBox="0 0 800 550" role="img" aria-labelledby="title desc"><title id="title">식탁 주문제작 개념도</title><desc id="desc">식탁 주문제작의 공간과 작동 관계를 도형과 화살표로 설명한 축척 없는 개념도</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#d17a38"/></marker></defs><rect width="800" height="550" fill="#fffdf9"/><g font-family="Apple SD Gothic Neo, Malgun Gothic, sans-serif"><rect x="140" y="135" width="520" height="30" fill="#e1ecea" stroke="#316b62" stroke-width="2" /><rect x="185" y="165" width="30" height="200" fill="#e1ecea" stroke="#316b62" stroke-width="2" /><rect x="585" y="165" width="30" height="200" fill="#e1ecea" stroke="#316b62" stroke-width="2" /><line x1="213" y1="240" x2="586" y2="240" stroke="#316b62" stroke-width="3" /><path d="M285 75 V125" fill="none" stroke="#d17a38" stroke-width="3" marker-end="url(#arrow)" /><path d="M520 75 V125" fill="none" stroke="#d17a38" stroke-width="3" marker-end="url(#arrow)" /><path d="M200 280 V350" fill="none" stroke="#d17a38" stroke-width="3" marker-end="url(#arrow)" /><path d="M600 280 V350" fill="none" stroke="#d17a38" stroke-width="3" marker-end="url(#arrow)" /><text x="340" y="105" font-size="18" fill="#253c40">상판 하중</text><text x="300" y="225" font-size="17" fill="#253c40">하부 연결</text><rect x="320" y="295" width="160" height="95" fill="#f8e9d9" stroke="#b77940" stroke-width="2" stroke-dasharray="7 5"/><text x="335" y="350" font-size="18" fill="#253c40">무릎 공간</text><line x1="95" y1="368" x2="705" y2="368" stroke="#67777d" stroke-width="3" /><text x="130" y="435" font-size="19" fill="#253c40">비례·흔들림·좌석 간섭을 함께 검토</text><text x="30" y="525" font-size="15" fill="#68777c">개념도 · 축척 없음</text></g></svg>