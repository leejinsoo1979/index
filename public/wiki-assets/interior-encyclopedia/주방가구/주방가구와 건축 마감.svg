<svg xmlns="http://www.w3.org/2000/svg" width="800" height="550" viewBox="0 0 800 550" role="img" aria-labelledby="title desc"><title id="title">주방가구와 건축 마감 개념도</title><desc id="desc">주방가구와 건축 마감의 공간과 작동 관계를 도형과 화살표로 설명한 축척 없는 개념도</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#d17a38"/></marker></defs><rect width="800" height="550" fill="#fffdf9"/><g font-family="Apple SD Gothic Neo, Malgun Gothic, sans-serif"><line x1="85" y1="85" x2="700" y2="85" stroke="#67777d" stroke-width="3" /><text x="90" y="60" font-size="19" fill="#253c40">천장 완성면</text><rect x="110" y="115" width="160" height="175" fill="#e1ecea" stroke="#316b62" stroke-width="2" /><rect x="110" y="115" width="25" height="175" fill="#c3d6d3" stroke="#316b62" stroke-width="2" /><text x="145" y="205" font-size="18" fill="#253c40">상부장</text><line x1="520" y1="85" x2="520" y2="425" stroke="#67777d" stroke-width="3" /><text x="545" y="165" font-size="18" fill="#253c40">벽 마감</text><rect x="110" y="315" width="410" height="25" fill="#f8e9d9" stroke="#b77940" stroke-width="2" /><rect x="135" y="340" width="365" height="85" fill="#e1ecea" stroke="#316b62" stroke-width="2" /><text x="205" y="377" font-size="18" fill="#253c40">하부장</text><text x="270" y="310" font-size="18" fill="#253c40">상판</text><circle cx="520" cy="315" r="8" fill="#d17a38" stroke="#253c40" stroke-width="2"/><path d="M675 290 H538" fill="none" stroke="#d17a38" stroke-width="3" marker-end="url(#arrow)" /><text x="570" y="270" font-size="18" fill="#253c40">접합부</text><line x1="85" y1="105" x2="430" y2="105" stroke="#d17a38" stroke-width="3" stroke-dasharray="7 5"/><text x="290" y="135" font-size="17" fill="#253c40">기준선 조율</text><text x="180" y="462" font-size="19" fill="#253c40">선의 정렬 ≠ 접합 기능의 생략</text><text x="30" y="525" font-size="15" fill="#68777c">개념도 · 축척 없음</text></g></svg>