<svg xmlns="http://www.w3.org/2000/svg" width="800" height="550" viewBox="0 0 800 550" role="img" aria-labelledby="title desc"><title id="title">냉장고장 설계 개념도</title><desc id="desc">냉장고장 설계의 공간과 작동 관계를 도형과 화살표로 설명한 축척 없는 개념도</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#d17a38"/></marker></defs><rect width="800" height="550" fill="#fffdf9"/><g font-family="Apple SD Gothic Neo, Malgun Gothic, sans-serif"><rect x="80" y="60" width="275" height="315" fill="#f0f3f4" stroke="#67777d" stroke-width="2" /><rect x="110" y="85" width="215" height="260" fill="#e1ecea" stroke="#316b62" stroke-width="2" /><text x="163" y="185" font-size="18" fill="#253c40">기기 본체</text><line x1="325" y1="85" x2="325" y2="345" stroke="#d17a38" stroke-width="3" /><text x="365" y="110" font-size="17" fill="#253c40">전면 패널</text><line x1="355" y1="106" x2="326" y2="106" stroke="#d17a38" stroke-width="3" /><path d="M325 345 Q510 345 510 160" fill="none" stroke="#d17a38" stroke-width="3" marker-end="url(#arrow)" /><text x="465" y="378" font-size="18" fill="#253c40">개폐 범위</text><rect x="112" y="65" width="210" height="17" fill="#f8e9d9" stroke="#b77940" stroke-width="2" /><path d="M217 65 V25" fill="none" stroke="#d17a38" stroke-width="3" marker-end="url(#arrow)" /><text x="390" y="65" font-size="18" fill="#253c40">통기 조건 확인</text><rect x="600" y="85" width="95" height="270" fill="#e1ecea" stroke="#316b62" stroke-width="2" /><text x="610" y="220" font-size="17" fill="#253c40">인접 장</text><line x1="575" y1="85" x2="575" y2="345" stroke="#788a93" stroke-width="3" stroke-dasharray="7 5"/><text x="85" y="435" font-size="19" fill="#253c40">기기·패널·주변 장을 함께 검토</text><text x="30" y="525" font-size="15" fill="#68777c">개념도 · 축척 없음</text></g></svg>