<svg xmlns="http://www.w3.org/2000/svg" width="800" height="550" viewBox="0 0 800 550" role="img" aria-labelledby="title desc"><title id="title">대면형 주방 개념도</title><desc id="desc">대면형 주방의 공간과 작동 관계를 도형과 화살표로 설명한 축척 없는 개념도</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#d17a38"/></marker></defs><rect width="800" height="550" fill="#fffdf9"/><g font-family="Apple SD Gothic Neo, Malgun Gothic, sans-serif"><rect x="80" y="50" width="635" height="75" fill="#e1ecea" stroke="#316b62" stroke-width="2" /><text x="280" y="95" font-size="18" fill="#253c40">벽면 저장·가전</text><rect x="230" y="235" width="340" height="90" fill="#e1ecea" stroke="#316b62" stroke-width="2" /><text x="340" y="285" font-size="18" fill="#253c40">작업대</text><circle cx="400" cy="195" r="23" fill="#f5d1ad" stroke="#253c40" stroke-width="2"/><path d="M400 220 V267" fill="none" stroke="#d17a38" stroke-width="3" marker-end="url(#arrow)" /><text x="445" y="201" font-size="17" fill="#253c40">조리자</text><rect x="230" y="385" width="340" height="55" fill="#f8e9d9" stroke="#b77940" stroke-width="2" /><text x="355" y="420" font-size="18" fill="#253c40">식탁</text><circle cx="400" cy="470" r="20" fill="#f5d1ad" stroke="#253c40" stroke-width="2"/><circle cx="280" cy="470" r="20" fill="#f5d1ad" stroke="#253c40" stroke-width="2"/><circle cx="520" cy="470" r="20" fill="#f5d1ad" stroke="#253c40" stroke-width="2"/><line x1="400" y1="215" x2="400" y2="388" stroke="#d17a38" stroke-width="3" stroke-dasharray="5 6"/><line x1="285" y1="148" x2="635" y2="148" stroke="#788a93" stroke-width="3" stroke-dasharray="7 5"/><text x="94" y="159" font-size="16" fill="#253c40">통로</text><text x="590" y="300" font-size="17" fill="#253c40">시선</text><line x1="576" y1="295" x2="410" y2="340" stroke="#d17a38" stroke-width="3" stroke-dasharray="5 6"/><text x="30" y="525" font-size="15" fill="#68777c">개념도 · 축척 없음</text></g></svg>