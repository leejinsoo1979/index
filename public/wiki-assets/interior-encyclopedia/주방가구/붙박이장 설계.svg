<svg xmlns="http://www.w3.org/2000/svg" width="800" height="550" viewBox="0 0 800 550" role="img" aria-labelledby="title desc"><title id="title">붙박이장 설계 개념도</title><desc id="desc">붙박이장 설계의 공간과 작동 관계를 도형과 화살표로 설명한 축척 없는 개념도</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#d17a38"/></marker></defs><rect width="800" height="550" fill="#fffdf9"/><g font-family="Apple SD Gothic Neo, Malgun Gothic, sans-serif"><path d="M70 80 L85 140 L72 210 L90 290 L78 385 L730 385 L718 300 L732 200 L720 80 Z" fill="#f0f3f4" stroke="#788a93" stroke-width="3"/><rect x="115" y="105" width="570" height="255" fill="#e1ecea" stroke="#316b62" stroke-width="2" /><line x1="300" y1="105" x2="300" y2="360" stroke="#316b62" stroke-width="3" /><line x1="500" y1="105" x2="500" y2="360" stroke="#316b62" stroke-width="3" /><line x1="500" y1="225" x2="685" y2="225" stroke="#316b62" stroke-width="3" /><line x1="115" y1="155" x2="300" y2="155" stroke="#316b62" stroke-width="3" /><line x1="207" y1="155" x2="207" y2="205" stroke="#316b62" stroke-width="3" /><path d="M207 190 L160 225 H252 Z" fill="none" stroke="#316b62" stroke-width="3"/><rect x="520" y="250" width="145" height="20" fill="#e1ecea" stroke="#316b62" stroke-width="2" /><rect x="520" y="285" width="145" height="20" fill="#e1ecea" stroke="#316b62" stroke-width="2" /><text x="160" y="305" font-size="18" fill="#253c40">걸기</text><text x="350" y="230" font-size="18" fill="#253c40">계절 물품</text><text x="545" y="180" font-size="18" fill="#253c40">이불</text><text x="535" y="340" font-size="17" fill="#253c40">접어 넣기</text><path d="M55 430 L99 340" fill="none" stroke="#d17a38" stroke-width="3" marker-end="url(#arrow)" /><text x="65" y="462" font-size="17" fill="#253c40">외곽 조정 영역</text><text x="385" y="438" font-size="18" fill="#253c40">물품에 따라 내부 구성</text><text x="30" y="525" font-size="15" fill="#68777c">개념도 · 축척 없음</text></g></svg>