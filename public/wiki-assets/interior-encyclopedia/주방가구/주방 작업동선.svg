<svg xmlns="http://www.w3.org/2000/svg" width="800" height="550" viewBox="0 0 800 550" role="img" aria-labelledby="title desc"><title id="title">주방 작업동선 개념도</title><desc id="desc">주방 작업동선의 공간과 작동 관계를 도형과 화살표로 설명한 축척 없는 개념도</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#d17a38"/></marker></defs><rect width="800" height="550" fill="#fffdf9"/><g font-family="Apple SD Gothic Neo, Malgun Gothic, sans-serif"><rect x="55" y="60" width="120" height="85" fill="#e1ecea" stroke="#316b62" stroke-width="2" /><text x="85" y="110" font-size="18" fill="#253c40">저장</text><rect x="245" y="60" width="120" height="85" fill="#e1ecea" stroke="#316b62" stroke-width="2" /><text x="275" y="110" font-size="18" fill="#253c40">세척</text><rect x="435" y="60" width="120" height="85" fill="#e1ecea" stroke="#316b62" stroke-width="2" /><text x="465" y="110" font-size="18" fill="#253c40">손질</text><rect x="625" y="60" width="120" height="85" fill="#e1ecea" stroke="#316b62" stroke-width="2" /><text x="655" y="110" font-size="18" fill="#253c40">가열</text><path d="M175 103 H235" fill="none" stroke="#d17a38" stroke-width="3" marker-end="url(#arrow)" /><path d="M365 103 H425" fill="none" stroke="#d17a38" stroke-width="3" marker-end="url(#arrow)" /><path d="M555 103 H615" fill="none" stroke="#d17a38" stroke-width="3" marker-end="url(#arrow)" /><rect x="590" y="265" width="155" height="80" fill="#f8e9d9" stroke="#b77940" stroke-width="2" /><text x="635" y="312" font-size="18" fill="#253c40">식사</text><path d="M685 145 V255" fill="none" stroke="#d17a38" stroke-width="3" marker-end="url(#arrow)" /><rect x="245" y="265" width="155" height="80" fill="#e1ecea" stroke="#316b62" stroke-width="2" /><text x="290" y="312" font-size="18" fill="#253c40">수납</text><path d="M590 305 H410" fill="none" stroke="#d17a38" stroke-width="3" marker-end="url(#arrow)" /><path d="M305 145 V255" fill="none" stroke="#d17a38" stroke-width="3" marker-end="url(#arrow)" /><text x="420" y="290" font-size="16" fill="#253c40">식후 정리</text><line x1="70" y1="390" x2="750" y2="390" stroke="#788a93" stroke-width="3" stroke-dasharray="8 6"/><text x="90" y="375" font-size="17" fill="#253c40">생활 통행은 작업 흐름과 구분</text><text x="30" y="525" font-size="15" fill="#68777c">개념도 · 축척 없음</text></g></svg>