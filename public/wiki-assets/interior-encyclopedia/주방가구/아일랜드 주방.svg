<svg xmlns="http://www.w3.org/2000/svg" width="800" height="550" viewBox="0 0 800 550" role="img" aria-labelledby="title desc"><title id="title">아일랜드 주방 개념도</title><desc id="desc">아일랜드 주방의 공간과 작동 관계를 도형과 화살표로 설명한 축척 없는 개념도</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#d17a38"/></marker></defs><rect width="800" height="550" fill="#fffdf9"/><g font-family="Apple SD Gothic Neo, Malgun Gothic, sans-serif"><rect x="80" y="45" width="620" height="65" fill="#e1ecea" stroke="#316b62" stroke-width="2" /><text x="280" y="85" font-size="18" fill="#253c40">벽면 작업·수납</text><rect x="225" y="210" width="360" height="105" fill="#e1ecea" stroke="#316b62" stroke-width="2" /><text x="335" y="270" font-size="18" fill="#253c40">독립 작업대</text><path d="M100 190 H690" fill="none" stroke="#d17a38" stroke-width="3" marker-end="url(#arrow)" /><text x="320" y="173" font-size="16" fill="#253c40">작업 통로</text><path d="M110 350 H690" fill="none" stroke="#d17a38" stroke-width="3" marker-end="url(#arrow)" /><text x="318" y="378" font-size="16" fill="#253c40">식사·이동 여유</text><line x1="115" y1="120" x2="115" y2="320" stroke="#788a93" stroke-width="3" stroke-dasharray="7 5"/><line x1="680" y1="120" x2="680" y2="320" stroke="#788a93" stroke-width="3" stroke-dasharray="7 5"/><rect x="80" y="420" width="240" height="12" fill="#aab6ba" stroke="#67777d" stroke-width="2" /><rect x="105" y="391" width="190" height="27" fill="#e1ecea" stroke="#316b62" stroke-width="2" /><rect x="135" y="410" width="130" height="10" fill="#536d70" stroke="#536d70" stroke-width="2" /><text x="360" y="415" font-size="17" fill="#253c40">하부 띄움 → 청소 접근 검토</text><text x="30" y="525" font-size="15" fill="#68777c">개념도 · 축척 없음</text></g></svg>