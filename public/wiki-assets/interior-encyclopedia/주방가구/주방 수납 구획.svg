<svg xmlns="http://www.w3.org/2000/svg" width="800" height="550" viewBox="0 0 800 550" role="img" aria-labelledby="title desc"><title id="title">주방 수납 구획 개념도</title><desc id="desc">주방 수납 구획의 공간과 작동 관계를 도형과 화살표로 설명한 축척 없는 개념도</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#d17a38"/></marker></defs><rect width="800" height="550" fill="#fffdf9"/><g font-family="Apple SD Gothic Neo, Malgun Gothic, sans-serif"><text x="90" y="55" font-size="21" fill="#253c40">쌓기</text><text x="492" y="55" font-size="21" fill="#253c40">분리 수납</text><rect x="55" y="105" width="285" height="220" fill="#f3f6f6" stroke="#67777d" stroke-width="2" /><rect x="75" y="275" width="245" height="22" fill="#e6aa70" stroke="#b77940" stroke-width="2" /><rect x="90" y="240" width="215" height="22" fill="#e1ecea" stroke="#316b62" stroke-width="2" /><rect x="105" y="205" width="185" height="22" fill="#e1ecea" stroke="#316b62" stroke-width="2" /><path d="M205 205 V120" fill="none" stroke="#d17a38" stroke-width="3" marker-end="url(#arrow)" /><text x="77" y="365" font-size="18" fill="#253c40">위 그릇부터 이동</text><rect x="430" y="105" width="310" height="220" fill="#f3f6f6" stroke="#67777d" stroke-width="2" /><rect x="465" y="155" width="28" height="140" fill="#e1ecea" stroke="#316b62" stroke-width="2" /><rect x="525" y="155" width="28" height="140" fill="#e6aa70" stroke="#b77940" stroke-width="2" /><rect x="585" y="155" width="28" height="140" fill="#e1ecea" stroke="#316b62" stroke-width="2" /><rect x="645" y="155" width="28" height="140" fill="#e1ecea" stroke="#316b62" stroke-width="2" /><path d="M539 160 V80" fill="none" stroke="#d17a38" stroke-width="3" marker-end="url(#arrow)" /><text x="458" y="365" font-size="18" fill="#253c40">필요한 그릇만 꺼냄</text><text x="175" y="435" font-size="18" fill="#253c40">세척 후 되넣는 동작도 같은 방식으로 비교</text><text x="30" y="525" font-size="15" fill="#68777c">개념도 · 축척 없음</text></g></svg>