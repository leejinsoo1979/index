<svg xmlns="http://www.w3.org/2000/svg" width="800" height="550" viewBox="0 0 800 550" role="img" aria-labelledby="title desc"><title id="title">빌트인 가구 손잡이 개념도</title><desc id="desc">빌트인 가구 손잡이의 공간과 작동 관계를 도형과 화살표로 설명한 축척 없는 개념도</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#d17a38"/></marker></defs><rect width="800" height="550" fill="#fffdf9"/><g font-family="Apple SD Gothic Neo, Malgun Gothic, sans-serif"><text x="95" y="50" font-size="21" fill="#253c40">돌출형 단면</text><rect x="125" y="105" width="35" height="280" fill="#e1ecea" stroke="#316b62" stroke-width="2" /><rect x="160" y="200" width="70" height="20" fill="#f8e9d9" stroke="#b77940" stroke-width="2" /><rect x="210" y="200" width="20" height="90" fill="#f8e9d9" stroke="#b77940" stroke-width="2" /><path d="M295 250 H240" fill="none" stroke="#d17a38" stroke-width="3" marker-end="url(#arrow)" /><text x="245" y="310" font-size="17" fill="#253c40">부품을 잡음</text><text x="480" y="50" font-size="21" fill="#253c40">채널형 단면</text><rect x="490" y="105" width="230" height="35" fill="#e1ecea" stroke="#316b62" stroke-width="2" /><rect x="490" y="195" width="35" height="190" fill="#e1ecea" stroke="#316b62" stroke-width="2" /><rect x="525" y="195" width="195" height="25" fill="#e1ecea" stroke="#316b62" stroke-width="2" /><line x1="585" y1="145" x2="585" y2="190" stroke="#316b62" stroke-width="3" /><path d="M430 168 H550" fill="none" stroke="#d17a38" stroke-width="3" marker-end="url(#arrow)" /><text x="390" y="252" font-size="17" fill="#253c40">손 진입</text><text x="540" y="285" font-size="17" fill="#253c40">홈 뒤 당김면</text><line x1="625" y1="265" x2="574" y2="197" stroke="#d17a38" stroke-width="3" /><text x="170" y="440" font-size="18" fill="#253c40">외부 부품이 없어도 손과 힘이 전달될 공간은 필요</text><text x="30" y="525" font-size="15" fill="#68777c">개념도 · 축척 없음</text></g></svg>