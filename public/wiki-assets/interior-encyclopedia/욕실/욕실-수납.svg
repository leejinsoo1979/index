<svg xmlns="http://www.w3.org/2000/svg" width="760" height="470" viewBox="0 0 760 470" role="img" aria-labelledby="title desc"><title id="title">욕실 수납 개념도</title><desc id="desc">세면 위치와 자주 쓰는 수납을 연결하고 상부 여분 보관을 구분한 욕실장 입면</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#527f80"/></marker></defs><rect width="760" height="470" fill="#fafbf8"/><g font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" fill="#30473f" stroke-linejoin="round"><rect x="100" y="70" width="560" height="225" fill="#f3f6f3" stroke="#4b6c65" stroke-width="2" /><rect x="105" y="75" width="235" height="90" fill="#e9ecdf" stroke="#4b6c65" stroke-width="2" /><rect x="345" y="75" width="310" height="90" fill="#e9ecdf" stroke="#4b6c65" stroke-width="2" /><text x="145" y="125" font-size="19">여분 · 보충품</text><rect x="105" y="170" width="235" height="120" fill="#d5e7de" stroke="#4b6c65" stroke-width="2" /><text x="157" y="234" font-size="19">자주 사용</text><rect x="345" y="170" width="310" height="120" fill="#dce8ed" stroke="#4b6c65" stroke-width="2" /><text x="425" y="234" font-size="19">거울 면</text><circle cx="495" cy="345" r="27" fill="#eddcca" stroke="#4b6c65" stroke-width="2"/><path d="M460 345 L265 260" fill="none" stroke="#488773" stroke-width="3"  marker-end="url(#arr)"/><text x="526" y="352" font-size="19">세면 위치</text><text x="110" y="390" font-size="19">빈도와 손이 닿는 범위를 함께 검토</text><text x="735" y="452" text-anchor="end" font-size="15" fill="#65736c">개념도 · 축척 없음</text></g></svg>