<svg xmlns="http://www.w3.org/2000/svg" width="760" height="470" viewBox="0 0 760 470" role="img" aria-labelledby="title desc"><title id="title">욕실 타일 배치 개념도</title><desc id="desc">벽과 바닥의 타일 분할선을 연계하되 배수 방향을 함께 살피는 전개 개념도</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#527f80"/></marker></defs><rect width="760" height="470" fill="#fafbf8"/><g font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" fill="#30473f" stroke-linejoin="round"><rect x="150" y="65" width="460" height="180" fill="#edf1e9" stroke="#4b6c65" stroke-width="2" /><rect x="150" y="245" width="460" height="110" fill="#dbe9ee" stroke="#4b6c65" stroke-width="2" /><path d="M305 65 V355 M460 65 V355 M150 155 H610 M150 245 H610" stroke="#a4afa8" stroke-width="3"/><text x="173" y="110" font-size="19">벽면</text><text x="173" y="285" font-size="19">바닥</text><rect x="173" y="322" width="414" height="13" fill="#5f8792" stroke="#4b6c65" stroke-width="2" /><path d="M360 265 L360 310" fill="none" stroke="#458da2" stroke-width="3"  marker-end="url(#arr)"/><path d="M520 265 L520 310" fill="none" stroke="#458da2" stroke-width="3"  marker-end="url(#arr)"/><text x="120" y="390" font-size="19">분할선의 연속 ↔ 바닥 배수 조건</text><path d="M650 150 L650 238" fill="none" stroke="#b78258" stroke-width="3"  marker-end="url(#arr)"/><text x="735" y="452" text-anchor="end" font-size="15" fill="#65736c">개념도 · 축척 없음</text></g></svg>