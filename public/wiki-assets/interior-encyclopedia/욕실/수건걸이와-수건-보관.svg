<svg xmlns="http://www.w3.org/2000/svg" width="760" height="470" viewBox="0 0 760 470" role="img" aria-labelledby="title desc"><title id="title">수건걸이와 수건 보관 개념도</title><desc id="desc">깨끗한 수건 보관과 손 닦기, 사용 후 회수 경로를 구분한 동선도</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#527f80"/></marker></defs><rect width="760" height="470" fill="#fafbf8"/><g font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" fill="#30473f" stroke-linejoin="round"><rect x="75" y="95" width="165" height="110" fill="#dbe8df" stroke="#4b6c65" stroke-width="2" /><text x="98" y="145" font-size="19">깨끗한 수건</text><text x="117" y="175" font-size="19">보관</text><rect x="310" y="210" width="135" height="100" fill="#dbe9ee" stroke="#4b6c65" stroke-width="2" /><text x="340" y="266" font-size="19">사용</text><rect x="520" y="95" width="165" height="110" fill="#eadfce" stroke="#4b6c65" stroke-width="2" /><text x="557" y="145" font-size="19">회수 장소</text><path d="M238 182 L322 225" fill="none" stroke="#488773" stroke-width="3"  marker-end="url(#arr)"/><path d="M444 225 L535 185" fill="none" stroke="#b78258" stroke-width="3"  marker-end="url(#arr)"/><rect x="300" y="65" width="155" height="80" fill="#f1f2ea" stroke="#4b6c65" stroke-width="2" /><text x="329" y="112" font-size="19">임시 걸이</text><path d="M375 207 L375 150" fill="none" stroke="#488773" stroke-width="3"  marker-end="url(#arr)"/><path d="M456 107 L520 125" fill="none" stroke="#b78258" stroke-width="3"  marker-end="url(#arr)"/><text x="145" y="375" font-size="19">공급 · 사용 · 회수를 분리해 연결</text><text x="735" y="452" text-anchor="end" font-size="15" fill="#65736c">개념도 · 축척 없음</text></g></svg>