<svg xmlns="http://www.w3.org/2000/svg" width="760" height="470" viewBox="0 0 760 470" role="img" aria-labelledby="title desc"><title id="title">욕실 설비 점검성 개념도</title><desc id="desc">천장 속 배관과 열 수 있는 접근부 및 욕조 보수부의 관계를 보여주는 단면</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#527f80"/></marker></defs><rect width="760" height="470" fill="#fafbf8"/><g font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" fill="#30473f" stroke-linejoin="round"><rect x="100" y="70" width="560" height="38" fill="#c8d0cb" stroke="#4b6c65" stroke-width="2" /><path d="M140 130 H570 V175" fill="none" stroke="#6a97a6" stroke-width="13"/><text x="220" y="154" font-size="19">천장 속 배관</text><rect x="100" y="202" width="560" height="15" fill="#dde7e0" stroke="#4b6c65" stroke-width="2" /><rect x="420" y="198" width="130" height="24" fill="#a5bcb0" stroke="#4b6c65" stroke-width="2" /><path d="M482 320 L482 235" fill="none" stroke="#488773" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#arr)"/><text x="395" y="350" font-size="19">열어 접근</text><rect x="130" y="270" width="190" height="90" fill="#dbe8ed" stroke="#4b6c65" stroke-width="2" /><rect x="145" y="315" width="90" height="30" fill="#c2d5cb" stroke="#4b6c65" stroke-width="2" /><path d="M118 385 L165 348" fill="none" stroke="#488773" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#arr)"/><text x="153" y="298" font-size="19">욕조</text><text x="75" y="420" font-size="19">설비 위치와 복구 범위를 함께 계획</text><text x="735" y="452" text-anchor="end" font-size="15" fill="#65736c">개념도 · 축척 없음</text></g></svg>