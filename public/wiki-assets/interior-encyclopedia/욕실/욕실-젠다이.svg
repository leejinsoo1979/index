<svg xmlns="http://www.w3.org/2000/svg" width="760" height="470" viewBox="0 0 760 470" role="img" aria-labelledby="title desc"><title id="title">욕실 젠다이 개념도</title><desc id="desc">기존 벽 앞의 배관 가림 공간과 상부 선반이 욕실 유효 공간을 차지하는 단면</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#527f80"/></marker></defs><rect width="760" height="470" fill="#fafbf8"/><g font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" fill="#30473f" stroke-linejoin="round"><rect x="130" y="65" width="40" height="285" fill="#c5cbc8" stroke="#4b6c65" stroke-width="2" /><rect x="170" y="185" width="165" height="165" fill="#dce4df" stroke="#4b6c65" stroke-width="2" /><rect x="170" y="173" width="170" height="14" fill="#899e91" stroke="#4b6c65" stroke-width="2" /><circle cx="225" cy="255" r="22" fill="#d0e6ef" stroke="#4b6c65" stroke-width="2"/><circle cx="280" cy="290" r="14" fill="#d0e6ef" stroke="#4b6c65" stroke-width="2"/><text x="80" y="48" font-size="19">기존 벽</text><text x="185" y="155" font-size="19">선반 윗면</text><path d="M365 185 L365 345" fill="none" stroke="#b78258" stroke-width="3"  marker-end="url(#arr)"/><text x="395" y="250" font-size="19">앞으로 나온 면</text><path d="M530 320 L355 320" fill="none" stroke="#488773" stroke-width="3"  marker-end="url(#arr)"/><text x="415" y="300" font-size="19">사용 공간 감소</text><text x="194" y="388" font-size="19">내부 설비는 개념 표시</text><text x="735" y="452" text-anchor="end" font-size="15" fill="#65736c">개념도 · 축척 없음</text></g></svg>