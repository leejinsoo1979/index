<svg xmlns="http://www.w3.org/2000/svg" width="760" height="470" viewBox="0 0 760 470" role="img" aria-labelledby="title desc"><title id="title">욕실 레이아웃 개념도</title><desc id="desc">출입구에서 세면과 변기 영역으로 갈라지는 동선 및 샤워 영역의 평면 관계</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#527f80"/></marker></defs><rect width="760" height="470" fill="#fafbf8"/><g font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" fill="#30473f" stroke-linejoin="round"><rect x="110" y="65" width="500" height="300" fill="#f6f8f7" stroke="#4b6c65" stroke-width="2" /><rect x="130" y="85" width="135" height="90" fill="#e7f0ed" stroke="#4b6c65" stroke-width="2" /><text x="153" y="130" font-size="19">세면</text><rect x="445" y="85" width="145" height="145" fill="#d9edf3" stroke="#4b6c65" stroke-width="2" /><text x="490" y="158" font-size="19">샤워</text><rect x="440" y="250" width="100" height="82" fill="#e7f0ed" stroke="#4b6c65" stroke-width="2" /><text x="464" y="298" font-size="19">변기</text><path d="M410 240 H585" stroke="#536d66" stroke-width="9"/><text x="465" y="226" font-size="16">경계</text><path d="M300 340 L300 170" fill="none" stroke="#488773" stroke-width="3"  marker-end="url(#arr)"/><path d="M300 200 L390 290" fill="none" stroke="#488773" stroke-width="3"  marker-end="url(#arr)"/><text x="235" y="388" font-size="19">출입 → 기능별 분기</text><text x="735" y="452" text-anchor="end" font-size="15" fill="#65736c">개념도 · 축척 없음</text></g></svg>