<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="650" viewBox="0 0 1120 650" role="img" aria-label="마감 기준 협의 관계 개념도"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#285976"/></marker></defs><rect width="1120" height="650" fill="#f8fafc"/><g font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif"><text x="40" y="38" font-size="17" fill="#486174">개념도 · 프로젝트별 조정</text><path d="M290 145 H365 V295 H440" fill="none" stroke="#285976" stroke-width="2.5" /><polygon data-arrow="true" points="440,295 429,290 429,300" fill="#285976"/><text x="365" y="208" text-anchor="middle" font-size="15" fill="#285976">의도 설명</text><path d="M290 445 H365 V295 H440" fill="none" stroke="#285976" stroke-width="2.5" /><polygon data-arrow="true" points="440,295 429,290 429,300" fill="#285976"/><text x="365" y="358" text-anchor="middle" font-size="15" fill="#285976">가능한 조건</text><path d="M680 295 H755 V145 H830" fill="none" stroke="#285976" stroke-width="2.5" /><polygon data-arrow="true" points="830,145 819,140 819,150" fill="#285976"/><text x="755" y="208" text-anchor="middle" font-size="15" fill="#285976">같은 기준 전달</text><path d="M950 200 V390" fill="none" stroke="#285976" stroke-width="2.5" /><polygon data-arrow="true" points="950,390 945,379 955,379" fill="#285976"/><text x="1010" y="295" text-anchor="middle" font-size="15" fill="#285976">작업 결과</text><path d="M950 500 V565 H560 V350" fill="none" stroke="#285976" stroke-width="2.5" stroke-dasharray="7 5"/><polygon data-arrow="true" points="560,350 555,361 565,361" fill="#285976"/><text x="755" y="553" text-anchor="middle" font-size="15" fill="#285976">차이 조정</text><rect x="50" y="90" width="240" height="110" rx="15" fill="#e7f1f6" stroke="#739cb0" stroke-width="1.5"/><text x="170" y="134" text-anchor="middle" font-weight="700" font-size="21" fill="#173b50">설계 의도</text><text x="170" y="166" text-anchor="middle" font-size="17" fill="#3e6071">보이고 싶은 관계</text><rect x="50" y="390" width="240" height="110" rx="15" fill="#e7f1f6" stroke="#739cb0" stroke-width="1.5"/><text x="170" y="434" text-anchor="middle" font-weight="700" font-size="21" fill="#173b50">실제 자재</text><text x="170" y="466" text-anchor="middle" font-size="17" fill="#3e6071">색·표면·접합</text><rect x="440" y="240" width="240" height="110" rx="15" fill="#e7f1f6" stroke="#739cb0" stroke-width="1.5"/><text x="560" y="284" text-anchor="middle" font-weight="700" font-size="21" fill="#173b50">마감 기준 합의</text><text x="560" y="316" text-anchor="middle" font-size="17" fill="#3e6071">경계와 역할 명료화</text><rect x="830" y="90" width="240" height="110" rx="15" fill="#e7f1f6" stroke="#739cb0" stroke-width="1.5"/><text x="950" y="134" text-anchor="middle" font-weight="700" font-size="21" fill="#173b50">작업자 공유</text><text x="950" y="166" text-anchor="middle" font-size="17" fill="#3e6071">공정별 준비</text><rect x="830" y="390" width="240" height="110" rx="15" fill="#e7f1f6" stroke="#739cb0" stroke-width="1.5"/><text x="950" y="434" text-anchor="middle" font-weight="700" font-size="21" fill="#173b50">현장 확인</text><text x="950" y="466" text-anchor="middle" font-size="17" fill="#3e6071">합의와 차이 비교</text><text x="40" y="630" font-size="14" fill="#617584">화살표는 정보·판단·작업의 연결을 뜻하며, 기술 시방이나 고정 공사 순서를 대신하지 않습니다.</text></g></svg>